    async function handleUbahPassword(e) {
        // 1. CEGAH REFRESH HALAMAN
        e.preventDefault();

        // Gunakan .trim() untuk menghapus spasi
        const oldPw = document.getElementById('pwOld').value.trim();
        const newPw = document.getElementById('pwNew').value.trim();
        const confPw = document.getElementById('pwNewC').value.trim();
        
        const errBox = document.getElementById('errPw');
        const btn = e.target.querySelector('button[type="submit"]');

        // 2. Validasi Input
        if (!newPw) {
            showErrorPw(errBox, 'Password baru tidak boleh kosong.');
            return;
        }

        if (!CONFIG.PASS_REGEX.test(newPw)) {
            showErrorPw(errBox, 'Password baru tidak memenuhi syarat keamanan.');
            return;
        }

        if (newPw !== confPw) {
            showErrorPw(errBox, 'Konfirmasi password baru tidak cocok.');
            return;
        }

        if (oldPw === newPw) {
            showErrorPw(errBox, 'Password baru tidak boleh sama dengan password lama.');
            return;
        }

        // 3. Enkripsi Password
        const oldHash = await sha256(oldPw);
        const newHash = await sha256(newPw);

        // 4. Tampilkan Loading
        const originalBtnText = btn.innerText;
        btn.disabled = true;
        btn.innerText = "Menyimpan...";
        errBox.classList.add('hidden');

        // 5. Kirim ke Server (API)
        const res = await API.post('changePassword', {
            username: STATE.currentUser.username,
            oldHash: oldHash,
            newHash: newHash
        });

        // 6. Handle Response
        if (res.success) {
            showToast('Password berhasil diubah!', 'success');
            
            // --- PERBAIKAN DI SINI ---
            
            // Ubah tulisan tombol menjadi "Berhasil!"`
            btn.innerText = "Berhasil!";
            
            // Kosongkan input secara MANUAL (agar tombol tidak ikut kembali ke "Simpan Password")
            document.getElementById('pwOld').value = '';
            document.getElementById('pwNew').value = '';
            document.getElementById('pwNewC').value = '';
            
            // Tutup modal setelah delay 1 detik agar user sempat melihat tulisan "Berhasil!"`}
            setTimeout(() => {
                closeModal();
            }, 1000);
            
            // -----------------------
        } else {
            errBox.textContent = res.message || 'Gagal mengubah password. Cek password lama Anda.';
            errBox.classList.remove('hidden');
            
            // Kembalikan tombol ke kondisi semula
            btn.disabled = false;
            btn.innerText = originalBtnText;
        }
    }

    function filterUserTable(q) {
        q = q.toLowerCase();

        // Desktop
        const rows = document.querySelectorAll('#tableUserWrap tr[id^="row-user-"]');
        let deskNum = 1;
        rows.forEach(row => {
            const text = row.textContent.toLowerCase();
            if (text.includes(q)) {
                row.style.display = '';
                const numCell = row.querySelector('.row-user-num');
                if (numCell) numCell.textContent = deskNum++;
            } else {
                row.style.display = 'none';
            }
        });

        // Mobile
        const cards = document.querySelectorAll('#userCardsMobile .card-user-item');
        let cardNum = 1;
        cards.forEach(card => {
            const text = card.textContent.toLowerCase();
            if (text.includes(q)) {
                card.style.display = '';
                const numSpan = card.querySelector('.card-user-num');
                if (numSpan) numSpan.textContent = cardNum++;
            } else {
                card.style.display = 'none';
            }
        });
    }

        // ✅ TAMBAHAN: Deteksi jika ini input musdes dari Admin Desa
        const isMusdesDesa = (id === 'musdes_desa');
        const isMusyawarah = (id === 'musyawarah') || isMusdesDesa; 
        const existData = isMusyawarah ? null : (id ? cachedUsulan.find(x => x.id === id) : null);

        const sdgOptionsHtml = CONFIG.SDGS ? CONFIG.SDGS.map(s => {
            const isChecked = currentSdgIds.includes(String(s.id)) ? 'checked' : '';

                    <div class="p-2 space-y-0.5" id="sdgMusdesOptions">
                        ${sdgOptionsHtml}

                </div>

        openModal(`<div class="modal-overlay fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4" onclick="if(event.target===this)closeModal()"><div class="bg-white rounded-2xl w-full max-w-2xl max-h-[90vh] overflow-y-auto shadow-2xl view-enter p-6"><div class="flex justify-between items-center mb-5"><h3 class="font-display font-700 text-xl">${existData ? 'Edit' : 'Buat'} Usulan ${isMusyawarah ? '(Hasil Musyawarah)' : ''}</h3><button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 p-1" aria-label="Tutup"><i class="fas fa-times text-lg"></i></button></div><form id="formUsulan" class="space-y-4"><div><label class="block text-sm font-semibold mb-1">Judul Usulan <span class="text-red-500">*</span></label><input type="text" id="fJudul" value="${escapeHtml(existData?.judul || '')}" required class="w-full px-4 py-2.5 border rounded-xl text-sm"></div><div class="grid grid-cols-1 sm:grid-cols-2 gap-4"><div><label class="block text-sm font-semibold mb-1">Kategori <span class="text-red-500">*</span></label><select id="fKategori" required class="w-full px-4 py-2.5 border rounded-xl text-sm bg-white">${CONFIG.KATEGORI.map(k => `<option ${existData?.kategori === k ? 'selected' : ''}>${k}</option>`).join('')}</select></div><div><label class="block text-sm font-semibold mb-1">RT <span class="text-red-500">*</span></label><div class="relative" id="rtSelectWrapper"><button type="button" onclick="toggleRtDropdown()" class="w-full px-4 py-2.5 border rounded-xl text-sm text-left bg-white flex justify-between items-center"><span id="rtLabel" class="${existData?.rt?.length ? '' : 'text-gray-400'}">${existData?.rt?.length ? existData.rt.join(', ') : 'Pilih RT...'}</span><i class="fas fa-chevron-down text-xs text-gray-400"></i></button><div id="rtDropdown" class="hidden absolute z-20 w-full mt-1 bg-white border rounded-xl shadow-lg max-h-56 overflow-hidden flex flex-col"><div class="p-2 border-b sticky top-0 bg-white z-10"><input type="text" id="r         setupRupiahInput('fBiaya');

    function toggleSdgMusdesDropdown() {
        const dd = document.getElementById('sdgMusdesDropdown');
        if(dd) dd.classList.toggle('hidden');
    }

    function updateSdgMusdesLabel() {
        const checkboxes = document.querySelectorAll('.sdg-musdes-cb:checked');
        const label = document.getElementById('sdgMusdesLabel');
        const hiddenInput = document.getElementById('fSdgId');
        
        const selectedIds = Array.from(checkboxes).map(cb => cb.value);
        hiddenInput.value = selectedIds.join(',');
        
        if (selectedIds.length === 0) {
            label.innerText = 'Pilih SDGs...';
            label.classList.add('text-gray-400');
            label.classList.remove('text-gray-800');
        } else {
            const labels = selectedIds.map(id => {
                const s = CONFIG.SDGS?.find(x => String(x.id) === id);
                return s ? s.kode : '';
            }).filter(Boolean);
            label.innerText = labels.join(', ');
            label.classList.remove('text-gray-400');
            label.classList.add('text-gray-800');
        }
    }

    function filterSdgMusdesOptions(q) {
        q = q.toLowerCase();
        const options = document.querySelectorAll('#sdgMusdesOptions > label');
        options.forEach(opt => {
            const text = opt.getAttribute('data-sdg-text')?.toLowerCase() || opt.textContent.toLowerCase();
            opt.style.display = text.includes(q) ? '' : 'none';
        });
    }

    // Tutup dropdown SDGs jika klik di luar
    document.addEventListener('click', function(e) {
        const wrapper = e.target.closest('#sdgMusdesDropdown') || e.target.closest('[onclick*="toggleSdgMusdesDropdown"]');
        const dd = document.getElementById('sdgMusdesDropdown');
        if (!wrapper && dd && !dd.classList.contains('hidden')) {
            dd.classList.add('hidden');
        }
    });

    function toggleRtDropdown() { const d = document.getElementById('rtDropdown'); if (d) { d.classList.toggle('hidden'); if (!d.classList.contains('hidden')) { const s = document.getElementById('rtSearch'); if (s) { s.value = ''; filterRtOptions(''); s.focus(); } } } }
    function updateRtLabel() { const ch = document.querySelectorAll('.rt-checkbox:checked'); const rts = Array.from(ch).map(c => c.value); const l = document.getElementById('rtLabel'); if (l) { l.textContent = rts.length ? rts.join(', ') : 'Pilih RT...'; l.classList.toggle('text-gray-400', !rts.length); } const d = document.getElementById('fDusun'); if (d) { const ds = [...new Set(rts.map(r => CONFIG.RT_MAP[r]))].filter(Boolean); d.value = ds.length ? ds.join(', ') : (d.value || STATE.currentUser?.dusun || ''); } }

osal</span>${i.linkProposal ? `<a href="${escapeHtml(i.linkProposal)}" target="_blank" rel="noopener" class="text-blue-500 underline font-semibold text-xs">Lihat</a>` : '<span class="text-gray-400">-</span>'}</div></div>${i.rankingDusun ? `<div class="flex justify-between items-center bg-blue-50 p-3 rounded-lg"><span class="text-blue-700 font-medium">Ranking Dusun</span><span class="font-display font-900 text-xl text-blue-700">#${i.rankingDusun}</span></div>` : ''}${i.sdgId ? `<div class="flex justify-between items-center bg-gray-50 p-3 rounded-lg"><span class="text-gray-600 font-medium">Mendukung SDGs</span><span class="font-semibold text-gray-800">${CONFIG.SDGS.find(s => s.id == i.sdgId)?.kode || ''} - ${CONFIG.SDGS.find(s => s.id == i.sdgId)?.nama || ''}</span></div>` : ''}${i.rankingDesa ? `<div class="flex justify-between items-center bg-forest-50 p-3 rounded-lg"><span class="text-forest-700 font-medium">Ranking Desa</span><span class="font-display font-900 text-xl text-forest-700">#${i.rankingDesa}</span></div>` : ''}${i.rencanaAksi ? `<div class="flex justify-between bg-gray-50 p-3 rounded-lg"><span class="text-gray-500">Rencana Aksi</span><span class="font-semibold">${escapeHtml(i.rencanaAksi)}</span></div>` : ''}${i.rujukanUsulan ? `<div class="flex justify-between bg-gray-50 p-3 rounded-lg"><span class="text-gray-500">Rujukan Ke</span><span class="font-semibold">${escapeHtml(i.rujukanUsulan)}</span></div>` : ''}${i.catatanKembali ? `<div class="bg-red-50 p-3 rounded-lg text-red-700"><i class="fas fa-comment-dots mr-1"></i><b>Catatan:</b><br>${escapeHtml(i.catatanKembali)}</div>` : ''}</div></div></div>`);
    }

    async function handleFormUsulan(form) {
        const errEl = document.getElementById('errUsulan'); 
        errEl.classList.add('hidden');
        const u = STATE.currentUser;
        const rts = Array.from(form.querySelectorAll('.rt-checkbox:checked')).map(c => c.value);
        
        if (!rts.length) { 
            errEl.textContent = 'Pilih minimal 1 RT.'; 
            errEl.classList.remove('hidden'); 
            return; 
        }
        
        const isMusdesDesa = document.getElementById('fIsMusdesDesa')?.value === 'true';
        const editId = document.getElementById('fId').value;
        const isEdit = !!editId;
        const rawBiaya = document.getElementById('fBiaya').value;
        const biayaNum = unformatRupiah(rawBiaya);
        
        const data = {
            id: editId || null, 
            username: u.username, 
            tahun: STATE.tahunAktif,
            judul: form.querySelector('#fJudul').value.trim(),
            kategori: form.querySelector('#fKategori').value,
            deskripsi: form.querySelector('#fDeskripsi').value.trim(),
            rt: rts, 
            dusun: form.querySelector('#fDusun').value, 
            desa: CONFIG.DESA,
            volume: parseInt(form.querySelector('#fVolume').value),
            satuan: form.querySelector('#fSatuan').value,
            estimasiBiaya: biayaNum,
            sdgId: form.querySelector('#fSdgId').value.split(',').filter(Boolean),
            linkProposal: form.querySelector('#fLink').value.trim()
        };
        
        // ✅ 2. ATUR LOGIKA STATUS & DATA AWAL
        if (isMusdesDesa && !isEdit) {
            // Musdes Desa - biarkan backend atur status
        } else if (isEdit) {
            const ex = cachedUsulan.find(x => x.id === editId);
            data.status = ex ? ex.status : 'draft';
            
            // ✅ TAMBAHAN: Kirim info siapa yang edit (untuk cek backend)
            data.editedBy = u.username;
            data.editedByRole = u.role;
        } else {
            // ✅ PERBAIKAN: Tambahkan admdesa
            if (u.role === 'admdusun') {
                data.status = 'diajukan';
            } else if (u.role === 'admdesa') {
                data.status = 'draft'; // atau 'diajukan' jika langsung
            } else {
                data.status = 'draft';
            }
            
            data.rankingDusun = ''; 
            data.rankingDesa = ''; 
            data.rencanaAksi = ''; 
            data.rujukanUsulan = ''; 
            data.catatanKembali = '';
        }
        
        // ✅ 3. DYNAMIS ENDPOINT API
        const apiAction = (isMusdesDesa && !isEdit) ? 'saveUsulanMusdes' : 'saveUsulan';
        
        setTableLoading(true);
        try {
            const res = await API.post(apiAction, data);
            
            if (res.success) {
                const newData = { ...data, ...(res.data || {}) };
                if (isEdit) {
                    const idx = cachedUsulan.findIndex(x => x.id === editId);
                    if (idx > -1) cachedUsulan[idx] = newData;
                } else {
                    cachedUsulan.unshift(newData);
                }
                closeModal();
                await fetchUsulan(true);
                const c = document.getElementById('tabContent');
                if (c) {
                    c.innerHTML = renderTab();
                    if (STATE.dashboardTab === 'beranda') initCharts();
                }
                
                // ✅ SESUAIKAN PESAN TOAST
                if (isMusdesDesa && !isEdit) {
                    showToast('Usulan hasil Musdes berhasil disimpan langsung sebagai Ranked Dusun.', 'success');
                } else if (isEdit) {
                    showToast('Usulan berhasil diperbarui', 'success');
                } else if (u.role === 'admdusun') {
                    showToast('Usulan berhasil disimpan & otomatis diajukan ke Desa.', 'success');
                } else if (u.role === 'admdesa') {
                    showToast('Usulan berhasil disimpan oleh Admin Desa.', 'success');
                } else {
                    showToast('Usulan berhasil disimpan sebagai draft', 'success');
                }
            } else {
                errEl.textContent = res.message || 'Gagal menyimpan'; 
                errEl.classList.remove('hidden'); 
            }
        } catch(e) {
            errEl.textContent = 'Gagal menyimpan. Periksa koneksi internet.'; 
            errEl.classList.remove('hidden'); 
        } finally {
            setTableLoading(false);
        }
    }

    async function switchTab(tab) {
        STATE.dashboardTab = tab;
        const sb = document.getElementById('sidebar');
        const ov = document.getElementById('sidebarOverlay');
        
        // Tutup sidebar otomatis di mobile saat ganti tab
        if (sb && !sb.classList.contains('-translate-x-full') && window.innerWidth < 1024) { 
            toggleSidebar(); 
        }

        // Update warna sidebar (Kode lama Anda, tetap dipertahankan)
        document.querySelectorAll('.sidebar-link').forEach(el => { el.classList.toggle('active', el.dataset.tab === tab); });

        // ✅ UPDATE BARU 1: Ganti tulisan Header sesuai tab yang diklik
        const tabs = getTabs(STATE.currentUser?.role);
        const currentTab = tabs.find(t => t.key === tab);
        const headerEl = document.getElementById('headerTitle');
        if (headerEl && currentTab) {
            headerEl.textContent = currentTab.label;
        }

        // ✅ UPDATE BARU 2: Ganti warna Bottom Nav saat di-klik di smartphone
        document.querySelectorAll('.bnav-btn').forEach(btn => {
            const isActive = btn.dataset.tab === tab;
            // Bersihkan kelas warna terlebih dahulu
            btn.classList.remove('text-honey-600', 'bg-honey-50', 'text-gray-400', 'active:text-gray-600', 'active:bg-gray-50');
            // Set warna berdasarkan status aktif/tidak
            if (isActive) {
                btn.classList.add('text-honey-600', 'bg-honey-50');
            } else {
                btn.classList.add('text-gray-400', 'active:text-gray-600', 'active:bg-gray-50');
            }
        });

        // --- KODE FETCH & RENDER ANDA DI BAWAH INI TIDAK DIUBAH SAMA SEKALI ---
        const c = document.getElementById('tabContent');
        const needsDataFetch = cachedUsulan.length === 0 || cachedUsulan[0].tahun != STATE.tahunAktif;
        let fetchPromises = [];
        if (needsDataFetch) { fetchPromises.push(fetchUsulan(true)); fetchPromises.push(fetchDeadline()); }
        if (tab === 'users') fetchPromises.push(fetchUsersData());
        if (tab === 'pengaturan') fetchPromises.push(fetchDeadlinesData());
        
        if (fetchPromises.length > 0 || needsDataFetch) {
            if (c) c.innerHTML = '<div class="text-center py-16 text-gray-400"><span class="spinner"></span> Memuat data...</div>';
            try { 
                await Promise.all(fetchPromises); 
                if (c) c.innerHTML = renderTab(); 
                if (tab === 'users') renderUserTable(); 
                if (tab === 'pengaturan') renderDeadlineSummary(); 
                if (tab === 'beranda') initCharts(); 
            } catch (e) { 
                console.error(e); 
                if (c) c.innerHTML = '<div class="text-center py-16 text-red-400"><i class="fas fa-exclamation-circle text-3xl mb-2 block"></i>Gagal memuat data.</div>'; 
            }
        } else {
            if (c) c.innerHTML = renderTab();
            if (tab === 'beranda') initCharts();
            if (tab === 'users') renderUserTable();
            if (tab === 'pengaturan') renderDeadlineSummary();
        }
        attachMainEvents();
    }

    async function handleLogout() {
        // Tutup dropdown akun jika sedang terbuka
        closeAccountMenu();

        // ✅ Gunakan pola Promise yang sama seperti showDeleteConfirm
        const isConfirmed = await showLogoutConfirm();

        if (!isConfirmed) return;

        // Kode logout asli
        clearTimeout(inactivityTimer); 
        clearInterval(deadlineInterval); 
        clearSession(); 
        navigate('landing');
    }

    function showLogoutConfirm() {
        return new Promise((resolve) => {
            // ✅ Gunakan class CSS yang SUDAH ADA (confirm-overlay) 
            // agar style dan animasi konsisten dengan modal hapus
            const overlay = document.createElement('div');
            overlay.className = 'confirm-overlay';
            overlay.id = 'logoutModal';
            overlay.innerHTML = `
                <div class="confirm-card">
                    <div class="confirm-icon" style="background: #fef2f2; color: #ef4444;">
                        <i class="fas fa-sign-out-alt" style="font-size: 1.5rem;"></i>
                    </div>
                    <div class="confirm-title">Keluar Akun?</div>
                    <div class="confirm-message">Anda harus login kembali untuk mengakses sistem.<br>Apakah Anda yakin ingin keluar?</div>
                    <div class="confirm-actions">
                        <button class="confirm-btn confirm-btn-cancel" id="btnCancelLogout">Batal</button>
                        <button class="confirm-btn confirm-btn-delete" id="btnConfirmLogout">Ya, Keluar</button>
                    </div>
                </div>
            `;

            document.body.appendChild(overlay);

            // Trigger animasi masuk
            requestAnimationFrame(() => {
                overlay.classList.add('active');
            });

            // Fungsi tutup dengan animasi keluar
            const closeModal = (result) => {
                overlay.classList.remove('active');
                setTimeout(() => {
                    overlay.remove();
                    resolve(result);
                }, 200); // Sesuai durasi CSS transition
            };

            // Event Listener
            overlay.querySelector('#btnCancelLogout').addEventListener('click', () => closeModal(false));
            overlay.querySelector('#btnConfirmLogout').addEventListener('click', () => closeModal(true));
            
            // Tutup jika klik area luar (overlay hitam)
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) closeModal(false);
            });
        });
    }

    function toggleAccountMenu(e) {
        if (e) e.stopPropagation();
        const menu = document.getElementById('accountMenu');
        const chevron = document.getElementById('accountChevron');
        if (!menu) return;
        
        const isHidden = menu.classList.contains('hidden');
        menu.classList.toggle('hidden');
        
        if (chevron) {
            chevron.style.transition = 'transform 0.2s ease';
            chevron.style.transform = isHidden ? 'rotate(180deg)' : 'rotate(0deg)';
        }
    }

    function closeAccountMenu() {
        const menu = document.getElementById('accountMenu');
        const chevron = document.getElementById('accountChevron');
        if (menu) menu.classList.add('hidden');
        if (chevron) {
            chevron.style.transition = 'transform 0.2s ease';
            chevron.style.transform = 'rotate(0deg)';
        }
    }

    // ✅ Tambahkan listener global untuk menutup menu saat klik di luar
    document.addEventListener('click', function(e) {
        const menu = document.getElementById('accountMenu');
        // Cek apakah klik di luar area account menu
        if (menu && !menu.classList.contains('hidden')) {
            const accountBtn = e.target.closest('[onclick*="toggleAccountMenu"]');
            if (!accountBtn) {
                closeAccountMenu();
            }

    // ==========================================
    // HELPER: FORMAT DURASI (DETIK → "1j 23m 45d")
    // ==========================================
    function formatDuration(totalSeconds) {
        if (!totalSeconds || totalSeconds < 0) return '0d';
        
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        
        let parts = [];
        if (hours > 0) parts.push(hours + 'j');
        if (minutes > 0) parts.push(minutes + 'm');
        if (seconds > 0 || parts.length === 0) parts.push(seconds + 'd');
        
        return parts.join(' ');
    }

        <div class="space-y-4">
            ${statsHTML}
            
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <div>
                    <h3 class="font-display font-bold text-xl">Musyawarah & Verifikasi Desa</h3>

            ${btns}
            
            <div class="relative">
                <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                <input type="text" id="searchDesaTable" placeholder="Cari judul usulan, pengusul, dusun, RT..."
                    class="w-full pl-10 pr-4 py-2.5 border rounded-lg text-sm bg-gray-50 focus:bg-white focus:ring-2 focus:ring-forest-200 focus:border-forest-400 transition-all"

    /* ==========================================
    ✅ FIX: FUNGSI-FUNGSI YANG SEBELUMNYA TIDAK ADA

    // ─── UPDATE META DESA (Rank, Aksi, Rujukan, Kordinator) ───
    async function updateMetaDesa(id) {
        const rankDesa = document.getElementById('rankd-' + id);
        const rencanaAksi = document.getElementById('aksi-' + id);
        const rujukan = document.getElementById('rujuk-text-' + id);
        const kordinator = document.getElementById('kord-' + id);

        const data = {
            id: id,
            rankingDesa: rankDesa ? rankDesa.value : '',
            rencanaAksi: rencanaAksi ? rencanaAksi.value : '',
            rujukanUsulan: rujukan ? rujukan.value : '',
            kordinator: kordinator ? kordinator.value : ''
        };

        // Validasi: Jika rencana aksi "Non Kewenangan" wajib isi rujukan
        if (data.rencanaAksi === 'Non Kewenangan Desa' && !data.rujukanUsulan.trim()) {
            showToast('Rujukan wajib diisi untuk "Non Kewenangan Desa"', 'warning');
            if (rujukan) rujukan.focus();
            return;
        }

        setTableLoading(true);
        try {
            const res = await API.post('updateMetaDesa', data);
            if (res.success) {
                showToast('Data usulan berhasil diperbarui', 'success');
                // Update cache lokal
                const item = cachedUsulan.find(u => u.id === id);
                if (item) {
                    item.rankingDesa = data.rankingDesa;
                    item.rencanaAksi = data.rencanaAksi;
                    item.rujukanUsulan = data.rujukanUsulan;
                    item.kordinator = data.kordinator;
                }
                sortDesaTable();
            } else {
                showToast(res.message || 'Gagal memperbarui data', 'error');
            }
        } catch (e) {
            showToast('Gagal memperbarui data. Periksa koneksi internet.', 'error');
        } finally {
            setTableLoading(false);
        }
    }

    // ─── PROSES DESA (Finalisasi Satu Usulan) ───
    async function prosesDesa(id, status) {
        const rankInput = document.getElementById('rankd-' + id);
        
        // Validasi ranking desa wajib diisi
        if (rankInput && !rankInput.value.trim()) {
            showToast('Isi ranking desa terlebih dahulu sebelum memfinalisasi', 'warning');
            rankInput.focus();
            return;
        }

        // Simpan meta dulu jika ada perubahan
        await updateMetaDesa(id);

        setTableLoading(true);
        try {
            const res = await API.post('prosesDesa', { id: id, status: status });
            if (res.success) {
                showToast(res.message || 'Usulan berhasil difinalisasi', 'success');
                await fetchUsulan(true);
                const c = document.getElementById('tabContent');
                if (c) {
                    c.innerHTML = renderTab();
                    if (STATE.dashboardTab === 'beranda') initCharts();
                }
            } else {
                showToast(res.message || 'Gagal memproses usulan', 'error');
            }
        } catch (e) {
            showToast('Gagal memproses. Periksa koneksi internet.', 'error');
        } finally {
            setTableLoading(false);
        }
    }

    // ─── BULK PROSES DESA (Finalisasi Banyak Usulan) ───
    async function bulkProsesDesa() {
        const checkedEls = document.querySelectorAll('.bulk-check-desa:checked');
        
        if (checkedEls.length === 0) {
            showToast('Pilih minimal 1 usulan untuk difinalisasi', 'warning');
            return;
        }

        const validIds = [];
        const invalidRows = [];

        // 1. Validasi: Pastikan semua yang dipilih punya ranking
        checkedEls.forEach(cb => {
            const id = cb.dataset.id;
            const rankInput = document.getElementById('rankd-' + id);
            if (rankInput && rankInput.value.trim()) {
                validIds.push(id);
            } else {
                invalidRows.push(id);
                cb.checked = false; // Uncheck yang tidak valid
            }
        });

        if (invalidRows.length > 0) {
            showToast(`${invalidRows.length} usulan dilewati karena ranking desa belum diisi`, 'warning');
            updateBulkCountDesa();
        }

        if (validIds.length === 0) return;

        // ✅ FIX 2: Gunakan modal konfirmasi yang tepat (BUKAN showDeleteConfirm)
        const isConfirmed = await showActionConfirm(
            'Finalisasi Usulan Terpilih?',
            `Anda akan memfinalisasi <strong>${validIds.length} usulan</strong>.<br><br>Data rank, rencana aksi, dan kordinator yang baru diisi di tabel akan langsung disimpan.`,
            'Ya, Finalisasi'
        );

        if (!isConfirmed) return;

        setTableLoading(true);
        try {
            // ✅ FIX 3: Simpan meta (rank, aksi, rujukan, kordinator) untuk SEMUA id yang dipilih SEBELUM finalisasi
            for (let i = 0; i < validIds.length; i++) {
                const id = validIds[i];
                const rankDesa = document.getElementById('rankd-' + id);
                const rencanaAksi = document.getElementById('aksi-' + id);
                const rujukan = document.getElementById('rujuk-text-' + id);
                const kordinator = document.getElementById('kord-' + id);

                const meta = {
                    id: id,
                    rankingDesa: rankDesa ? rankDesa.value : '',
                    rencanaAksi: rencanaAksi ? rencanaAksi.value : '',
                    rujukanUsulan: rujukan ? rujukan.value : '',
                    kordinator: kordinator ? kordinator.value : ''
                };

                // Kirim update meta di background (tanpa blocking/notif per item)
                API.post('updateMetaDesa', meta).catch(err => console.error('Gagal update meta untuk', id, err));
            }

            // Kirim permintaan finalisasi bulk
            const res = await API.post('bulkProsesDesa', { ids: validIds, status: 'final' });
            if (res.success) {
                let msg = res.message || `${validIds.length} usulan berhasil difinalisasi`;
                if (res.skipped > 0) {
                    msg += ` (${res.skipped} usulan dilewati)`;
                }
                showToast(msg, 'success');
                await fetchUsulan(true);
                const c = document.getElementById('tabContent');
                if (c) {
                    c.innerHTML = renderTab();
                    if (STATE.dashboardTab === 'beranda') initCharts();
                }
            } else {
                showToast(res.message || 'Gagal memfinalisasi usulan', 'error');
            }
        } catch (e) {
            showToast('Gagal memfinalisasi. Periksa koneksi internet.', 'error');
        } finally {
            setTableLoading(false);
        }
    }

    // ==========================================
    // MODAL KONFIRMASI AKSI UMUM (BUKAN HAPUS)
    // ==========================================
    function showActionConfirm(title, message, btnText) {
        return new Promise((resolve) => {
            const overlay = document.createElement('div');
            overlay.className = 'confirm-overlay';
            overlay.innerHTML = `
                <div class="confirm-card">
                    <div class="confirm-icon" style="background: #f0fdf4; color: #16a34a;">
                        <i class="fas fa-check-double" style="font-size: 1.5rem;"></i>
                    </div>
                    <div class="confirm-title">${title}</div>
                    <div class="confirm-message">${message}</div>
                    <div class="confirm-actions">

    // ✅ FIX: Hanya satu definisi filterDesaTable (hapus duplikat)
    function filterDesaTable(q) {
        q = q.toLowerCase();
        // ✅ FIX: Gunakan selector spesifik #tableDesaWrap
        const tbodies = document.querySelectorAll('#tableDesaWrap tbody[id^="row-desa-"]');
        
        tbodies.forEach(tbody => {
            const text = tbody.textContent.toLowerCase();
            tbody.style.display = text.includes(q) ? '' : 'none';
        });
        
        // Perbarui nomor urut sesuai urutan baru
        sortDesaTable(); 
    }

    function sortDesaTable() {
        const table = document.getElementById('tableDesaWrap');
        if (!table) return;
        
        // Ambil semua baris usulan (bukan empty row)
        const items = Array.from(table.querySelectorAll('tbody[id^="row-desa-"]'));
        
        // Pisahkan visible dan hidden
        const visibleItems = items.filter(item => item.style.display !== 'none');
        const hiddenItems = items.filter(item => item.style.display === 'none');
        
        // Urutkan hanya yang visible berdasarkan rank input
        visibleItems.sort((a, b) => {
            const rankAInput = a.querySelector('input[type="number"]');
            const rankBInput = b.querySelector('input[type="number"]');
            
            const valA = parseInt(rankAInput?.value) || 999;
            const valB = parseInt(rankBInput?.value) || 999;
            
            if (valA === valB) return 0;
            return valA - valB;
        });
        
        // Rebuild: visible dulu, lalu hidden di akhir
        const orderedItems = [...visibleItems, ...hiddenItems];
        
        // Pindahkan posisi elemen di DOM
        orderedItems.forEach(item => table.appendChild(item));
        
        // Update nomor urut HANYA untuk yang visible
        let num = 1;
        visibleItems.forEach(item => {
            const numCell = item.querySelector('.row-desa-num');
            if (numCell) numCell.textContent = num++;
        });
    }

        const checkedEls = document.querySelectorAll('.check-kembali-desa:checked');

                ids: ids, 
                tahunBaru: STATE.tahunAktif 
            });

            if (res.success) {
                let msg = res.message || 'Berhasil diajukan kembali';

                btn.innerHTML = originalText;
            }
        } catch (e) {
            showToast('Gagal mengajukan kembali. Periksa koneksi internet.', 'error');
            btn.disabled = false;
            btn.innerHTML = originalText;
        }

    /* ==========================================
    NORMALISASI SDG IDS
    ========================================== */
    function normalizeSdgIds(item) {
        if (Array.isArray(item.sdgIds)) return item.sdgIds.map(id => String(id).trim()).filter(Boolean);
        if (typeof item.sdgIds === 'string' && item.sdgIds.trim()) return item.sdgIds.split(',').map(s => String(s).trim()).filter(Boolean);
        if (item.sdgId !== null && item.sdgId !== undefined && item.sdgId !== '') {
            var str = String(item.sdgId).trim();
            if (str.indexOf(',') !== -1) return str.split(',').map(s => s.trim()).filter(Boolean);
            return [str];
        }
        if (Array.isArray(item.sdgs)) return item.sdgs.map(s => String(s.id || s.sdgId || s).trim()).filter(Boolean);
        if (typeof item.sdgs === 'string' && item.sdgs.trim()) {
            try { const p = JSON.parse(item.sdgs); if (Array.isArray(p)) return p.map(s => String(s.id || s.sdgId || s).trim()).filter(Boolean); } catch (e) { return item.sdgs.match(/\d+/g) || []; }
        }
        return [];
    }

    /* ==========================================
    CEK SDG TERPILIH (TYPE-SAFE)
    ========================================== */
    function isSdgSelected(normalizedIds, sdgId) {
        return normalizedIds.some(id => String(id) === String(sdgId));
    }

    /* ==========================================
    TABEL VERIFIKASI DUSUN (HANYA MODE TABEL)
    ========================================== */
    function rVerifDusunTable(u, list) {
        const locked = STATE.isLocked;
        list.sort((a, b) => { const ra = parseInt(a.rankingDusun) || 999, rb = parseInt(b.rankingDusun) || 999; return ra - rb; });
        
        let statsHTML = '';
        try { if (typeof statsBar === 'function') statsHTML = statsBar(list); } catch(e) {}
        const emptyText = 'Tidak ada usulan yang perlu diproses';

        // ─── Shared Builders ───
        function buildSdgChips(sdgIds, itemId) {
            return sdgIds.map(sid => {
                const s = CONFIG.SDGS.find(x => String(x.id) === String(sid));
                if (!s) return '';
                return `<span class="inline-flex items-center gap-1 px-1.5 py-0.5 bg-blue-100 text-blue-700 rounded text-[10px] font-medium" data-sdg-chip="${sid}">${s.kode}<i class="fas fa-times cursor-pointer hover:text-red-500 transition-colors" onclick="event.stopPropagation(); removeSdg('${itemId}', '${sid}')"></i></span>`;
            }).join('');
        }

        function buildSdgOptions(sdgIds, itemId) {
            return CONFIG.SDGS.map(s => {
                const checked = isSdgSelected(sdgIds, s.id) ? 'checked' : '';
                return `<label class="flex items-center gap-2 px-2 py-1.5 hover:bg-blue-50 rounded cursor-pointer text-xs transition-colors sdg-option-${itemId}" data-sdg-text="${s.kode} ${s.nama}"><input type="checkbox" value="${s.id}" class="sdg-cb-${itemId} rounded border-gray-300 text-blue-600 focus:ring-blue-500" ${checked} onchange="updateSdgChips('${itemId}')"><span class="font-semibold text-gray-500 w-8">${s.kode}</span><span class="text-gray-700">${s.nama}</span></label>`;
            }).join('');
        }

        function sumberBadge(isOwnMusyawarah, namaPengusul, username) {
            return isOwnMusyawarah
                ? '<span class="inline-flex items-center gap-1 px-2 py-0.5 bg-honey-50 text-honey-700 rounded-full font-semibold text-[11px]"><i class="fas fa-users text-[9px]"></i>Musyawarah</span>'
                : `<span class="text-xs text-gray-500">${escapeHtml(namaPengusul || username)}</span>`;
        }

        // ═══════════════════════════════════════════
        //  TABLE ROWS HTML
        // ═══════════════════════════════════════════
        let rowsHTML = '';
        if (list.length) {
            rowsHTML = list.map((i, n) => { 
                const isOwnMusyawarah = i.username === u.username; 
                const isDiajukan = i.status === 'diajukan'; 
                const isDikembalikan = i.status === 'dikembalikan_dusun'; 
                const canEditMusyawarah = isOwnMusyawarah && isDiajukan && !locked; 
                const sdgIds = normalizeSdgIds(i);
                const itemId = escapeJs(i.id);
                const sdgChips = buildSdgChips(sdgIds, itemId);
                const sdgOptions = buildSdgOptions(sdgIds, itemId);
                
                let actionBtns = '';
                actionBtns += `<button onclick="event.stopPropagation(); updateMetaDusun('${itemId}')" class="group relative w-8 h-8 flex items-center justify-center rounded-lg bg-blue-100 text-blue-600 hover:bg-blue-200 transition-colors"><i class="fas fa-save text-xs"></i><span class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 px-2 py-0.5 bg-gray-800 text-white text-[10px] font-medium rounded whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-50">Update</span></button>`;
                actionBtns += `<button onclick="event.stopPropagation(); prosesDusun('${itemId}','ranked_dusun')" class="group relative w-8 h-8 flex items-center justify-center rounded-lg bg-green-100 text-green-600 hover:bg-green-200 transition-colors"><i class="fas fa-paper-plane text-xs"></i><span class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 px-2 py-0.5 bg-gray-800 text-white text-[10px] font-medium rounded whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-50">Submit</span></button>`;
                if (isDiajukan && !isOwnMusyawarah) actionBtns += `<button onclick="event.stopPropagation(); openModalKembalikan('${itemId}','dikembalikan_user')" class="group relative w-8 h-8 flex items-center justify-center rounded-lg bg-amber-100 text-amber-700 hover:bg-amber-200 transition-colors"><i class="fas fa-undo text-xs"></i><span class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 px-2 py-0.5 bg-gray-800 text-white text-[10px] font-medium rounded whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-50">Kembalikan</span></button>`;
                if (isDikembalikan && isOwnMusyawarah) actionBtns += `<button onclick="event.stopPropagation(); openFormUsulan('${itemId}')" class="group relative w-8 h-8 flex items-center justify-center rounded-lg bg-indigo-100 text-indigo-600 hover:bg-indigo-200 transition-colors"><i class="fas fa-pen text-xs"></i><span class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 px-2 py-0.5 bg-gray-800 text-white text-[10px] font-medium rounded whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-50">Edit Usulan</span></button>`;
                if (canEditMusyawarah) {
                    actionBtns += `<button onclick="event.stopPropagation(); openFormUsulan('${itemId}')" class="group relative w-8 h-8 flex items-center justify-center rounded-lg bg-indigo-100 text-indigo-600 hover:bg-indigo-200 transition-colors"><i class="fas fa-pen text-xs"></i><span class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 px-2 py-0.5 bg-gray-800 text-white text-[10px] font-medium rounded whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-50">Edit</span></button>`;
                    actionBtns += `<button onclick="event.stopPropagation(); hapusUsulanMusyawarah('${itemId}','${escapeJs(i.judul)}')" class="group relative w-8 h-8 flex items-center justify-center rounded-lg bg-red-100 text-red-600 hover:bg-red-200 transition-colors"><i class="fas fa-trash-alt text-xs"></i><span class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 px-2 py-0.5 bg-gray-800 text-white text-[10px] font-medium rounded whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-50">Hapus</span></button>`;
                }
                
                const catatanHtml = isDikembalikan ? `<div class="flex items-start gap-2 text-xs text-amber-700 bg-amber-50 rounded-lg p-3"><i class="fas fa-comment-dots mt-0.5 flex-shrink-0"></i><div><b class="block mb-0.5">Catatan Pemerintah Desa:</b>${escapeHtml(i.catatanKembali)}</div></div>` : '';
                
                // Form fleksibel mengikuti lebar jendela
                const subContent = locked 
                    ? '<div class="text-xs text-red-500 font-medium"><i class="fas fa-lock mr-1"></i>Pengimputan ditutup.</div>'
                    : `<div class="flex flex-col gap-3">
                            <div class="flex flex-wrap items-center gap-x-5 gap-y-2">
                                <div class="flex items-center gap-2">
                                    <label class="text-xs font-semibold text-gray-600 whitespace-nowrap">Ranking:</label>
                                    <input type="number" min="1" placeholder="#" value="${i.rankingDusun}" class="w-20 px-2 py-1.5 border rounded-lg text-sm text-center" id="rank-${i.id}" oninput="sortDusunTable()">
                                </div>
                                <div class="flex items-center gap-1.5">${actionBtns}</div>
                            </div>
                            <div class="flex flex-col sm:flex-row sm:items-start gap-2 sm:gap-4">
                                <label class="text-xs font-semibold text-gray-600 whitespace-nowrap pt-1.5">SDGs:</label>
                                <div class="relative w-full sm:flex-1 sm:max-w-[400px]" id="sdg-wrapper-${i.id}">
                                    <div onclick="event.stopPropagation(); toggleSdgDropdown('${itemId}')" class="flex items-center gap-1 px-3 py-2 border rounded-lg text-sm bg-white cursor-pointer min-h-[38px]">
                                        <span class="text-gray-400 text-xs ${sdgIds.length ? 'hidden' : ''}" id="sdg-placeholder-${i.id}">Pilih SDGs...</span>
                                        <div class="flex flex-wrap gap-1" id="sdg-chips-${i.id}">${sdgChips}</div>
                                        <i class="fas fa-chevron-down text-[10px] text-gray-400 ml-auto flex-shrink-0 transition-transform" id="sdg-arrow-${i.id}"></i>
                                    </div>
                                    <div class="hidden absolute z-50 mt-1 bg-white border rounded-lg shadow-xl p-1.5 w-full sm:w-auto sm:min-w-[280px] max-h-[220px] overflow-y-auto" id="sdg-dropdown-${i.id}">
                                        <div class="sticky top-0 bg-white pb-1 mb-1 border-b">
                                            <input type="text" placeholder="Cari SDGs..." class="w-full px-2 py-1 text-xs border rounded-md focus:outline-none focus:ring-1 focus:ring-blue-400" oninput="filterSdgOptions('${itemId}', this.value)">
                                        </div>
                                        ${sdgOptions}
                                    </div>
                                </div>
                            </div>
                        </div>`;
                
                return `<tbody id="row-${i.id}">
                            <tr class="main-row cursor-pointer hover:bg-gray-50/80" onclick="showDetail('${itemId}')">
                                <td class="td-cell text-center">${locked ? '' : `<input type="checkbox" class="bulk-check accent-honey-500" data-id="${i.id}" onclick="event.stopPropagation()" onchange="updateBulkCount()">`}</td>
                                <td class="td-cell text-center text-gray-400 row-dusun-num tabular-nums">${n + 1}</td>
                                <td class="td-cell text-center">${statusLabel(i.status)}</td>
                                <td class="td-cell font-semibold text-gray-800 td-judul">${escapeHtml(i.judul)}</td>
                                <td class="td-cell text-gray-500 whitespace-nowrap">${Array.isArray(i.rt) ? i.rt.join(', ') : i.rt}</td>
                                <td class="td-cell text-gray-600 whitespace-nowrap">${i.volume} ${escapeHtml(i.satuan)}</td>
                                <td class="td-cell text-right font-semibold text-gray-700 whitespace-nowrap tabular-nums">${formatRupiah(i.estimasiBiaya)}</td>
                                <td class="td-cell text-center">${sumberBadge(isOwnMusyawarah, i.namaPengusul, i.username)}</td>
                            </tr>
                            <tr class="sub-row">
                                <td colspan="8" class="sub-cell">
                                    <div class="sub-content">${catatanHtml}${subContent}</div>
                                </td>
                            </tr>
                        </tbody>`;
            }).join('');
        } else {
            rowsHTML = `<tbody><tr><td colspan="8" class="text-center py-12 text-gray-400 text-sm">${emptyText}</td></tr></tbody>`;
        }

        // ═══════════════════════════════════════════
        //  HEADER BUTTONS (RESPONSIF)
        // ═══════════════════════════════════════════
        let headerBtnsHTML = '';
        if (locked) {
            headerBtnsHTML = `<span class="px-3 py-1.5 bg-red-100 text-red-700 text-xs font-bold rounded-lg"><i class="fas fa-lock mr-1"></i>Pengimputan Ditutup</span>`;
        } else {
            headerBtnsHTML = `
            <div class="sm:hidden space-y-2">
                <button onclick="bulkProsesDusun()" class="w-full h-10 px-4 flex items-center justify-center gap-1.5 btn-success text-xs font-semibold rounded-lg shadow-sm"><i class="fas fa-check-double"></i> Submit Terpilih ke Desa</button>
                <div id="bulkCountMobile" class="bulk-count hidden text-xs text-honey-700 font-semibold pl-1 -mt-1"><span id="bulkNumMobile">0</span> terpilih</div>
                <div class="flex items-center gap-2">
                    <button onclick="openFormUsulan('musyawarah')" class="flex-1 h-10 px-3 flex items-center justify-center gap-2 rounded-lg bg-blue-600 text-white shadow-sm hover:bg-blue-700 active:bg-blue-800 transition-colors text-xs font-semibold"><i class="fas fa-file-circle-plus text-sm"></i> Input Musyawarah</button>
                    <button onclick="openAjukanKembaliDusunModal()" class="flex-1 h-10 px-3 flex items-center justify-center gap-2 rounded-lg bg-forest-600 text-white shadow-sm hover:bg-forest-700 active:bg-forest-800 transition-colors text-xs font-semibold"><i class="fas fa-rotate-left text-sm"></i> Ajukan Kembali</button>
                </div>
            </div>
            <div class="hidden sm:flex sm:flex-wrap sm:items-center sm:justify-between gap-3 mb-3">
                <div class="flex items-center gap-2">
                    <button onclick="bulkProsesDusun()" class="h-10 px-4 flex items-center gap-1.5 btn-success text-xs font-semibold rounded-lg shadow-sm"><i class="fas fa-check-double"></i>Submit Terpilih ke Desa</button>
                    <span id="bulkCount" class="bulk-count hidden text-xs text-honey-700 font-semibold ml-1"><span id="bulkNum">0</span> terpilih</span>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="openFormUsulan('musyawarah')" class="group relative w-10 h-10 flex items-center justify-center rounded-lg bg-blue-600 text-white shadow-sm hover:bg-blue-700 transition-colors"><i class="fas fa-file-circle-plus text-sm"></i><span class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 px-2 py-0.5 bg-gray-800 text-white text-[10px] font-medium rounded whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-50">Input Musyawarah</span></button>
                    <button onclick="openAjukanKembaliDusunModal()" class="group relative w-10 h-10 flex items-center justify-center rounded-lg bg-forest-600 text-white shadow-sm hover:bg-forest-700 transition-colors"><i class="fas fa-rotate-left text-sm"></i><span class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 px-2 py-0.5 bg-gray-800 text-white text-[10px] font-medium rounded whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none z-50">Ajukan Kembali</span></button>
                </div>
            </div>`;
        }

        // ═══════════════════════════════════════════
        //  RENDER
        // ═══════════════════════════════════════════
        return `
        <style>
            /* ── FLUID TYPOGRAPHY ── */
            #tableDusunWrap { font-size: clamp(0.7rem, 1.2vw, 0.875rem); }
            #tableDusunWrap thead { font-size: clamp(0.65rem, 0.95vw, 0.75rem); }
            #tableDusunWrap .td-judul { font-size: clamp(0.75rem, 1.3vw, 0.95rem); font-weight: 600; }

            /* ── FLUID SPACING (PADDING OTOMATIS MENGIKUT LAYAR) ── */
            #tableDusunWrap th, 
            #tableDusunWrap td.td-cell { 
                padding: clamp(0.4rem, 0.8vw, 0.65rem) clamp(0.5rem, 1vw, 0.75rem); 
                vertical-align: middle;
                border-bottom: 1px solid #e5e7eb;
                border-right: 1px solid #e5e7eb;
                line-height: 1.5;
            }
            #tableDusunWrap th:last-child,
            #tableDusunWrap td.td-cell:last-child { border-right: none; }

            /* ── SUB-ROW (BOTTOM CONTENT) FLEKSIBEL ── */
            #tableDusunWrap td.sub-cell { 
                padding: 0; 
                border-bottom: 1px solid #e5e7eb; 
                background-color: #f9fafb; 
            }
            #tableDusunWrap .sub-content { 
                padding: clamp(0.65rem, 1.2vw, 1rem) clamp(0.75rem, 1.5vw, 1.25rem);
                display: flex;
                flex-direction: column;
                gap: clamp(0.5rem, 0.8vw, 0.75rem);
                font-size: clamp(0.7rem, 1.1vw, 0.85rem);
            }

            /* ── HEADER STYLING ── */
            #tableDusunWrap thead th { 
                background-color: #f9fafb; 
                color: #4b5563; 
                text-transform: uppercase; 
                letter-spacing: 0.05em; 
                font-weight: 600;
                position: sticky;
                top: 0;
                z-index: 10;
                border-bottom: 2px solid #e5e7eb;
            }

            /* ── INTERAKSI BARIS ── */
            #tableDusunWrap tbody tr { transition: background-color 0.15s ease; }
            #tableDusunWrap tbody tr:hover > td.td-cell { background-color: #f9fafb; }
            
            /* ── SCROLLBAR KLASIK ── */
            .tbl-inner {
                scrollbar-gutter: stable; 
                overflow-x: auto; 
                overflow-y: auto; 
                scrollbar-width: thin; 
                scrollbar-color: #94a3b8 #e2e8f0;
            }
            .tbl-inner::-webkit-scrollbar { width: 8px; height: 16px; }
            .tbl-inner::-webkit-scrollbar-track { background: #e2e8f0; }
            .tbl-inner::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 2px; border: 2px solid #e2e8f0; }
            .tbl-inner::-webkit-scrollbar-thumb:hover { background: #64748b; }
            .tbl-inner::-webkit-scrollbar-corner { background: #e2e8f0; }
        </style>

        <div class="space-y-4">
            ${statsHTML}
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <div>
                    <h3 class="font-display font-bold text-xl">Verifikasi & Input Dusun</h3>
                    <p class="text-xs text-gray-400 mt-0.5">Beri peringkat lalu submit ke Desa. Klik baris untuk detail.</p>
                </div>
                ${locked ? `<div class="flex items-center gap-2">${headerBtnsHTML}</div>` : ''}
            </div>
            ${!locked ? headerBtnsHTML : ''}
            
            <div class="relative">
                <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs"></i>
                <input type="text" id="searchDusunTable" placeholder="Cari judul usulan, RT, atau Pengusul..." class="w-full pl-10 pr-4 py-2.5 border rounded-lg text-sm bg-gray-50 focus:bg-white focus:ring-2 focus:ring-forest-200 focus:border-forest-400 transition-all" oninput="filterDusunTable(this.value)">
            </div>
            
            <!-- TABEL VIEW -->
            <div class="container mx-auto px-2 sm:px-4 md:px-6 xl:max-w-[1600px]">
                <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
                    <div class="tbl-inner h-[500px] scroll-smooth">
                        <table class="w-full min-w-[800px] border-collapse" id="tableDusunWrap">
                            <colgroup>
                                <col style="width: 40px">   
                                <col style="width: 40px">  
                                <col style="width: 120px"> 
                                <col>                     
                                <col style="width: 80px">   
                                <col style="width: 120px">  
                                <col style="width: 150px">  
                                <col style="width: 140px">  
                            </colgroup>
                            <thead>
                                <tr>
                                    <th class="text-center">${locked ? '' : `<input type="checkbox" onchange="document.querySelectorAll('.bulk-check').forEach(c=>{c.checked=this.checked});updateBulkCount()" aria-label="Pilih semua">`}</th>
                                    <th class="text-center">No</th>
                                    <th class="text-center">Status</th>
                                    <th class="text-left">Judul Usulan</th>
                                    <th class="text-center">RT</th>
                                    <th class="text-center">Volume</th>
                                    <th class="text-right">Estimasi</th>
                                    <th class="text-center">Pengusul</th>
                                </tr>
                            </thead>
                            ${rowsHTML}
                        </table>
                    </div>
                </div>
            </div>
        </div>`;
    }

    /* ==========================================
    FITUR SEARCH, SORTIR & BULK (HANYA TABEL)
    ========================================== */
    function filterDusunTable(q) {
        q = q.toLowerCase();
        const tbodies = document.querySelectorAll('#tableDusunWrap tbody[id^="row-"]');
        let num = 1;
        tbodies.forEach(tbody => {
            const text = tbody.textContent.toLowerCase();
            if (text.includes(q)) { 
                tbody.style.display = ''; 
                const nc = tbody.querySelector('.row-dusun-num'); 
                if (nc) nc.textContent = num++; 
            } else { 
                tbody.style.display = 'none'; 
            }
        });
        sortDusunTable(); 
    }

    function sortDusunTable() {
        const table = document.getElementById('tableDusunWrap');
        if (!table) return;
        
        const items = Array.from(table.querySelectorAll('tbody[id^="row-"]'));
        items.sort((a, b) => {
            const idA = a.id.replace('row-', ''), idB = b.id.replace('row-', '');
            const elA = document.getElementById('rank-' + idA);
            const elB = document.getElementById('rank-' + idB);
            const valA = parseInt(elA ? elA.value : '') || 999;
            const valB = parseInt(elB ? elB.value : '') || 999;
            return valA - valB; 
        });
        
        items.forEach(item => table.appendChild(item));
        let num = 1;
        items.forEach(item => { 
            const nc = item.querySelector('.row-dusun-num'); 
            if (nc && item.style.display !== 'none') nc.textContent = num++; 
        });
    }

    function updateBulkCount() {
        const count = document.querySelectorAll('.bulk-check:checked').length;
        const wd = document.getElementById('bulkCount'); const nd = document.getElementById('bulkNum');
        if (wd && nd) { if(count > 0) { wd.classList.remove('hidden'); nd.textContent = count; } else { wd.classList.add('hidden'); } }
        const wm = document.getElementById('bulkCountMobile'); const nm = document.getElementById('bulkNumMobile');
        if (wm && nm) { if(count > 0) { wm.classList.remove('hidden'); nm.textContent = count; } else { wm.classList.add('hidden'); } }
    }

    /* ==========================================
    AKSI PROSES DUSUN & DESA (LANGSUNG AMAN)
    ========================================== */
    async function prosesDusun(id, status) {
        const rankEl = document.getElementById('rank-' + id);
        const rank = rankEl ? rankEl.value.trim() : '';
        
        const sdgArr = getSelectedSdgs(id);
        const sdgId = sdgArr.join(',');
        
        if (status === 'ranked_dusun' && !rank) {
            showToast('Masukkan ranking dusun terlebih dahulu', 'warning');
            if (rankEl) rankEl.focus();
            return;
        }
        if (sdgArr.length === 0) {
            showToast('Pilih minimal 1 SDGs', 'warning');
            return;
        }
        
        setTableLoading(true);
        const res = await API.post('prosesDusun', { id: id, status: status, rankingDusun: rank, sdgId: sdgId });
        if (res.success) { showToast('Usulan berhasil diproses', 'success'); await refreshCurrentTab(); } 
        else { showToast(res.message || 'Gagal memproses usulan', 'error'); setTableLoading(false); }
    }

    async function bulkProsesDusun() {
        const checks = document.querySelectorAll('.bulk-check:checked');
        if (!checks.length) { showToast('Pilih minimal satu usulan', 'warning'); return; }
        const ids = []; let hasEmptyRank = false; let hasEmptySdg = false;
        
        checks.forEach(c => {
            const id = c.dataset.id;
            const rankEl = document.getElementById('rank-' + id);
            const rank = rankEl ? rankEl.value.trim() : '';
            const sdgArr = getSelectedSdgs(id);
            const sdgId = sdgArr.join(',');
            
            if (!rank) hasEmptyRank = true;
            if (sdgArr.length === 0) hasEmptySdg = true;
            ids.push({ id: id, rankingDusun: rank, sdgId: sdgId });
        });
        
        if (hasEmptyRank) { showToast('Semua usulan terpilih harus memiliki ranking', 'warning'); return; }
        if (hasEmptySdg) { showToast('Semua usulan terpilih harus memiliki minimal 1 SDGs', 'warning'); return; }
        
        setTableLoading(true); let allOk = true;
        for (const item of ids) { 
            const res = await API.post('prosesDusun', { id: item.id, status: 'ranked_dusun', rankingDusun: item.rankingDusun, sdgId: item.sdgId }); 
            if (!res.success) allOk = false; 
        }
        if (allOk) { showToast(`${ids.length} usulan berhasil disubmit ke Desa`, 'success'); await refreshCurrentTab(); } 
        else { showToast('Sebagian usulan gagal diproses', 'error'); setTableLoading(false); }
    }

    async function updateMetaDusun(id) {
        const sdgIds = getSelectedSdgs(id);
        if (sdgIds.length === 0) { showToast('Pilih minimal 1 SDGs.', 'warning'); return; }

        const rankInput = document.getElementById('rank-' + id);
        const rankVal = rankInput ? rankInput.value.trim() : '';

        setTableLoading(true);
        const res = await API.post('updateMetaUsulan', { id: id, rankingDusun: rankVal, sdgId: sdgIds.join(',') });
        if (res.success) {
            const u = cachedUsulan.find(x => x.id === id);
            if (u) { u.sdgIds = sdgIds; u.sdgId = sdgIds.join(','); u.rankingDusun = rankVal; }
            showToast('Data berhasil diperbarui', 'success');
            sortDusunTable(); 
        } else { showToast(res.message || 'Gagal memperbarui data', 'error'); }
        setTableLoading(false);
    }

    /* ==========================================
    SDG FUNCTIONS (HANYA TABEL)
    ========================================== */
    function toggleSdgDropdown(id) {
        const dd = document.getElementById('sdg-dropdown-' + id);
        const ar = document.getElementById('sdg-arrow-' + id);
        if (!dd) return;
        
        // Tutup dropdown lain yang terbuka
        document.querySelectorAll('[id^="sdg-dropdown-"]').forEach(el => {
            if (el.id !== 'sdg-dropdown-' + id) { 
                el.classList.add('hidden'); 
                const oa = document.getElementById(el.id.replace('dropdown-', 'arrow-')); 
                if (oa) oa.style.transform = ''; 
            }
        });

        const isHidden = dd.classList.contains('hidden');
        dd.classList.toggle('hidden');
        if (ar) ar.style.transform = isHidden ? 'rotate(180deg)' : '';
        if (isHidden) { 
            const si = dd.querySelector('input[type="text"]'); 
            if (si) { si.value = ''; filterSdgOptions(id, ''); setTimeout(() => si.focus(), 50); } 
        }
    }

    function filterSdgOptions(id, keyword) {
        const kw = keyword.toLowerCase().trim();
        document.querySelectorAll('.sdg-option-' + id).forEach(opt => {
            const text = (opt.getAttribute('data-sdg-text') || '').toLowerCase();
            opt.style.display = (!kw || text.includes(kw)) ? '' : 'none';
        });
    }

    function updateSdgChips(id) {
        const checkboxes = document.querySelectorAll('.sdg-cb-' + id + ':checked');
        const chipsContainer = document.getElementById('sdg-chips-' + id);
        const placeholder = document.getElementById('sdg-placeholder-' + id);
        if (!chipsContainer) return;
        
        if (checkboxes.length === 0) { 
            if(placeholder) placeholder.classList.remove('hidden'); 
            chipsContainer.innerHTML = ''; 
        } else {
            if(placeholder) placeholder.classList.add('hidden');
            chipsContainer.innerHTML = Array.from(checkboxes).map(cb => {
                const label = cb.closest('label');
                const kode = label.querySelector('.font-semibold').textContent.trim();
                return `<span class="inline-flex items-center gap-1 px-1.5 py-0.5 bg-blue-100 text-blue-700 rounded text-[10px] font-medium" data-sdg-chip="${cb.value}">${kode}<i class="fas fa-times cursor-pointer hover:text-red-500 transition-colors" onclick="event.stopPropagation(); removeSdg('${id}', '${cb.value}')"></i></span>`;
            }).join('');
        }
    }

    function removeSdg(id, value) {
        const cb = document.querySelector(`.sdg-cb-${id}[value="${value}"]`);
        if (cb) cb.checked = false;
        updateSdgChips(id);
    }

    function getSelectedSdgs(id) {
        return Array.from(document.querySelectorAll('.sdg-cb-' + id + ':checked')).map(cb => cb.value);
    }

    // Tutup dropdown SDG jika klik di luar
    document.addEventListener('click', function (e) {
        document.querySelectorAll('[id^="sdg-wrapper-"]').forEach(wrapper => {
            if (!wrapper.contains(e.target)) {
                const id = wrapper.id.replace('sdg-wrapper-', '');
                const dropdown = document.getElementById('sdg-dropdown-' + id);
                const arrow = document.getElementById('sdg-arrow-' + id);
                if (dropdown) dropdown.classList.add('hidden');
                if (arrow) arrow.style.transform = '';
            }
        });
    });

    /* ==========================================
    MODAL KEMBALIKAN & HAPUS (TIDAK DIUBAH)
    ========================================== */
    function openModalKembalikan(id, status) {
        const targetLabel = status === 'dikembalikan_user' ? 'Warga' : 'Dusun';
        openModal(`
            <div class="modal-overlay fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-[999]" onclick="if(event.target===this)closeModal()">
                <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
                    <div class="p-6 space-y-4">
                        <div class="flex items-center gap-3 mb-2">
                            <div class="w-10 h-10 bg-amber-100 rounded-full flex items-center justify-center flex-shrink-0"><i class="fas fa-undo text-amber-600"></i></div>
                            <h3 class="font-display font-700 text-lg text-gray-900">Kembalikan ke ${targetLabel}</h3>
                        </div>
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-1.5">Catatan Pengembalian <span class="text-red-500">*</span></label>
                            <textarea id="kembaliCatatan" rows="4" class="w-full px-4 py-3 border rounded-xl text-sm bg-gray-50" placeholder="Jelaskan alasan pengembalian usulan ini..."></textarea>
                        </div>
                        <div id="kembalikanErr" class="hidden text-sm text-red-600 bg-red-50 p-2.5 rounded-lg"></div>
                    </div>
                    <div class="flex border-t border-gray-100">
                        <button onclick="closeModal()" class="flex-1 py-3 text-sm font-semibold text-gray-600 hover:bg-gray-50 transition-colors">Batal</button>
                        <button onclick="konfirmasiKembalikan('${escapeJs(id)}','${escapeJs(status)}')" class="flex-1 py-3 text-sm font-semibold text-amber-600 hover:bg-amber-50 transition-colors border-l border-gray-100">Kembalikan</button>
                    </div>
                </div>
            </div>
        `);
    }

    async function konfirmasiKembalikan(id, status) {
        const catatan = document.getElementById('kembaliCatatan');
        const errEl = document.getElementById('kembalikanErr');
        if (!catatan || !catatan.value.trim()) { if (errEl) { errEl.classList.remove('hidden'); errEl.textContent = 'Catatan pengembalian wajib diisi'; } return; }
        closeModal(); setTableLoading(true);
        let action = 'prosesDesa'; let payload = { id: id, status: status, catatanKembali: catatan.value.trim() };
        if (status === 'dikembalikan_user') action = 'prosesDusun';
        const res = await API.post(action, payload);
        if (res.success) { showToast('Usulan berhasil dikembalikan', 'success'); await refreshCurrentTab(); } 
        else { showToast(res.message || 'Gagal mengembalikan usulan', 'error'); setTableLoading(false); }
    }

    function hapusUsulanMusyawarah(id, judul) {
        openModal(`
            <div class="modal-overlay fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-[999]" onclick="if(event.target===this)closeModal()">
                <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden">
                    <div class="p-6 text-center space-y-4">
                        <div class="w-14 h-14 bg-red-100 rounded-full flex items-center justify-center mx-auto"><i class="fas fa-exclamation-triangle text-red-500 text-xl"></i></div>
                        <div>
                            <h3 class="font-display font-700 text-lg text-gray-900">Hapus Usulan Musyawarah?</h3>
                            <p class="text-sm text-gray-500 mt-2">Usulan <b class="text-gray-700">${escapeHtml(judul)}</b> akan dihapus permanen.</p>
                        </div>
                    </div>
                    <div class="flex border-t border-gray-100">
                        <button onclick="closeModal()" class="flex-1 py-3 text-sm font-semibold text-gray-600 hover:bg-gray-50 transition-colors">Batal</button>
                        <button onclick="konfirmasiHapusMusyahwarah('${escapeJs(id)}')" class="flex-1 py-3 text-sm font-semibold text-red-600 hover:bg-red-50 transition-colors border-l border-gray-100">Ya, Hapus</button>
                    </div>
                </div>
            </div>
        `);
    }

    async function konfirmasiHapusMusyahwarah(id) {
        closeModal(); setTableLoading(true);
        const res = await API.post('deleteUsulan', { ids: [id] });
        if (res.success) { showToast('Usulan musyawarah berhasil dihapus', 'success'); await refreshCurrentTab(); } 
        else { showToast(res.message || 'Gagal menghapus usulan', 'error'); setTableLoading(false); }
    }
    </script>
</body>
</html>
