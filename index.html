    // Update Dropdown RT saat Dusun berubah
    function updateRtOptionsPenyesuaian() {
        const selectedDusun = document.getElementById('editFull_dusun')?.value;
        const rtSelect = document.getElementById('editFull_rt');
        if (!rtSelect) return;

        const rtList = Object.entries(CONFIG.RT_MAP)
            .filter(([rt, dusun]) => dusun === selectedDusun)
            .map(([rt]) => rt)
            .sort();

        rtSelect.innerHTML = '<option value="">-- Pilih RT --</option>' + 
            rtList.map(rt => `<option value="${rt}">RT ${rt}</option>`).join('');
        
        // ✅ FIX: Hapus error lama dengan class yang benar ('.val-err')
        rtSelect.classList.remove('border-red-400');
        const errEl = rtSelect.parentNode.querySelector('.val-err');
        if (errEl) errEl.remove();
    }

    // Toggle SDGs di Modal
    function toggleSdgsEditFull(id) {
        const input = document.getElementById('editFull_sdgId');
        let current = input.value ? input.value.split(',').map(s => parseInt(s.trim())).filter(s => !isNaN(s)) : [];
        
        if (current.includes(id)) {
            current = current.filter(s => s !== id);
        } else {
            current.push(id);
            current.sort((a, b) => a - b);
        }
        
        input.value = current.join(',');
        
        const el = document.querySelector(`.sdgs-edit-item-${id}`);
        if (el) {
            if (current.includes(id)) {
                el.classList.remove('border-gray-200', 'opacity-40', 'hover:opacity-70');
                el.classList.add('border-current', 'shadow-sm');
                el.style.backgroundColor = el.style.color + '15';
            } else {
                el.classList.add('border-gray-200', 'opacity-40', 'hover:opacity-70');
                el.classList.remove('border-current', 'shadow-sm');
                el.style.backgroundColor = '';
            }
        }

        if (current.length > 0) {
            const grid = document.getElementById('editFull_sdgsGrid');
            // ✅ FIX: Gunakan class yang benar
            const errEl = grid?.parentNode.querySelector('.val-err');
            if (errEl) errEl.remove();
        }
    }

    /* ==========================================
        VALIDASI FORM PENYESUAIAN
        ========================================== */
    function validatePenyesuaianForm() {
        const judul = document.getElementById('editFull_judul')?.value.trim();
        const dusun = document.getElementById('editFull_dusun')?.value;
        const rt = document.getElementById('editFull_rt')?.value;
        const kategori = document.getElementById('editFull_kategori')?.value;
        const volume = document.getElementById('editFull_volume')?.value;
        const satuan = document.getElementById('editFull_satuan')?.value;
        const estimasiBiaya = document.getElementById('editFull_estimasiBiaya')?.value;
        const deskripsi = document.getElementById('editFull_deskripsi')?.value.trim();
        const sdgId = document.getElementById('editFull_sdgId')?.value.trim();

        const setError = (id, msg) => {
            const el = document.getElementById(id);
            if (!el) return;
            el.classList.add('border-red-400');
            el.classList.remove('border-gray-200');
            const oldErr = el.parentNode.querySelector('.val-err');
            if (oldErr) oldErr.remove();
            const errEl = document.createElement('div');
            errEl.className = 'text-red-500 text-[10px] mt-1 font-medium val-err';
            errEl.textContent = msg;
            el.parentNode.appendChild(errEl);
        };

        const clearErrors = () => {
            document.querySelectorAll('#formEditPenyesuaian .val-err').forEach(el => el.remove());
            ['editFull_judul', 'editFull_dusun', 'editFull_rt', 'editFull_kategori', 'editFull_volume', 'editFull_satuan', 'editFull_estimasiBiaya', 'editFull_deskripsi'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    el.classList.remove('border-red-400');
                    el.classList.add('border-gray-200');
                }
            });
        };

        clearErrors();
        let isValid = true;

        if (!judul || judul.length < 10) {
            setError('editFull_judul', !judul ? 'Judul usulan wajib diisi' : 'Judul terlalu singkat (min 10 karakter)');
            isValid = false;
        }
        if (!dusun) { setError('editFull_dusun', 'Pilih dusun terlebih dahulu'); isValid = false; }
        if (!rt) { setError('editFull_rt', 'Pilih RT terlebih dahulu'); isValid = false; }
        else if (dusun && CONFIG.RT_MAP[rt] !== dusun) { setError('editFull_rt', `RT ${rt} bukan wilayah ${dusun}`); isValid = false; }
        if (!kategori) { setError('editFull_kategori', 'Pilih kategori'); isValid = false; }
        if (!volume || Number(volume) <= 0) { setError('editFull_volume', 'Volume harus angka lebih dari 0'); isValid = false; }
        if (!satuan) { setError('editFull_satuan', 'Pilih satuan'); isValid = false; }
        
        const cleanBiaya = String(estimasiBiaya).replace(/\D/g, '');
        if (!cleanBiaya || parseInt(cleanBiaya) <= 0) { setError('editFull_estimasiBiaya', 'Estimasi biaya wajib diisi'); isValid = false; }
        
        if (!deskripsi || deskripsi.length < 20) { setError('editFull_deskripsi', !deskripsi ? 'Deskripsi wajib diisi' : 'Deskripsi terlalu singkat (min 20 karakter)'); isValid = false; }
        
        if (!sdgId) {
            const grid = document.getElementById('editFull_sdgsGrid');
            if (grid) {
                const oldErr = grid.parentNode.querySelector('.val-err');
                if (oldErr) oldErr.remove();
                const errEl = document.createElement('div');
                errEl.className = 'text-red-500 text-[10px] mt-1 font-medium val-err';
                errEl.textContent = 'Pilih minimal 1 tujuan SDGs Desa';
                grid.parentNode.appendChild(errEl);
            }
            isValid = false;
        }

        return isValid;
    }

    /* ==========================================
        SIMPAN HASIL EDIT (SUPER ADMIN MODE)
        ========================================== */
    async function saveFullEditPenyesuaian(id) {
        const btn = document.querySelector('#formEditPenyesuaian .bg-blue-600');
        const btnTextDefault = '<i class="fas fa-save mr-1.5"></i> Simpan Perubahan';
        const btnTextLoading = '<i class="fas fa-spinner fa-spin mr-1.5"></i> Menyimpan...';

        try {
            if (!validatePenyesuaianForm()) {
                showToast('Lengkapi data yang ditandai merah', 'error');
                return;
            }

            const originalData = cachedUsulan.find(u => u.id === id);
            if (!originalData) {
                showToast('Data asli tidak ditemukan di cache', 'error');
                return;
            }

            const elJudul = document.getElementById('editFull_judul');
            const elDusun = document.getElementById('editFull_dusun');
            const elRt = document.getElementById('editFull_rt');
            const elKategori = document.getElementById('editFull_kategori');
            const elStatus = document.getElementById('editFull_status');
            const elVolume = document.getElementById('editFull_volume');
            const elSatuan = document.getElementById('editFull_satuan');
            const elEstimasi = document.getElementById('editFull_estimasiBiaya');
            const elDeskripsi = document.getElementById('editFull_deskripsi');
            const elSdgId = document.getElementById('editFull_sdgId');
            const elCatatan = document.getElementById('editFull_catatanKasiKaur');

            const judul = (elJudul && elJudul.value ? elJudul.value : '').trim();
            const dusun = (elDusun && elDusun.value ? elDusun.value : '');
            const rt = (elRt && elRt.value ? elRt.value : '');
            const kategori = (elKategori && elKategori.value ? elKategori.value : '');
            const status = (elStatus && elStatus.value ? elStatus.value : 'draft');
            const volumeRaw = (elVolume && elVolume.value ? elVolume.value : '0');
            const satuan = (elSatuan && elSatuan.value ? elSatuan.value : '');
            const estimasiRaw = (elEstimasi && elEstimasi.value ? elEstimasi.value : '0');
            const deskripsi = (elDeskripsi && elDeskripsi.value ? elDeskripsi.value : '').trim();
            const sdgIdRaw = (elSdgId && elSdgId.value ? elSdgId.value : '').trim();
            const catatanKasiKaur = (elCatatan && elCatatan.value ? elCatatan.value : '').trim();

            const volume = parseFloat(volumeRaw);
            const estimasiBiaya = parseInt(estimasiRaw.replace(/\D/g, ''), 10);
            
            let sdgId = '';
            if (sdgIdRaw) {
                const sdgArray = sdgIdRaw.split(',').map(s => parseInt(s.trim(), 10)).filter(s => !isNaN(s) && s >= 1 && s <= 17);
                sdgId = sdgArray.join(',');
            }

            // Kirim payload bersih langsung ke fungsi doPenyesuaianDesa
            const payload = {
                action: 'penyesuaianDesa', // <- BARIS INI YANG SEBELUMNYA HILANG
                id: id,
                tahun: STATE.tahunAktif, 
                judul: judul,
                dusun: dusun,
                rt: [rt], 
                kategori: kategori,
                status: status,
                volume: isNaN(volume) ? 0 : volume,
                satuan: satuan,
                estimasiBiaya: isNaN(estimasiBiaya) ? 0 : estimasiBiaya,
                deskripsi: deskripsi,
                sdgId: sdgId,
                catatanKasiKaur: catatanKasiKaur
            };

            if (btn) {
                btn.disabled = true;
                btn.innerHTML = btnTextLoading;
                btn.classList.add('opacity-75', 'cursor-not-allowed');
            }

            const res = await fetch(CONFIG.API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(payload)
            });
            
            const result = await res.json();
            
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = btnTextDefault;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            }

            if (!result.success) {
                showToast(result.message || 'Gagal menyimpan di server', 'error');
                return;
            }

            // Update cache lokal dengan data bersih
            const cleanCacheData = {
                ...originalData, 
                tahun: STATE.tahunAktif, 
                judul: judul,
                dusun: dusun,
                rt: [rt], 
                kategori: kategori,
                status: status,
                volume: isNaN(volume) ? 0 : volume,
                satuan: satuan,
                estimasiBiaya: isNaN(estimasiBiaya) ? 0 : estimasiBiaya,
                deskripsi: deskripsi,
                sdgId: sdgId,
                catatanKasiKaur: catatanKasiKaur
            };

            const idx = cachedUsulan.findIndex(u => u.id === id);
            if (idx !== -1) {
                cachedUsulan[idx] = cleanCacheData; 
            }
            
            closeModal();

            // Render ulang langsung
            const tbody = document.getElementById('tbodyPenyesuaian');
            if (tbody) {
                const parentContainer = tbody.closest('.space-y-4');
                if (parentContainer) {
                    const newTableHTML = rPenyesuaian();
                    const divMatch = newTableHTML.match(/<div class="space-y-4">([\s\S]*)<\/div>\s*$/);
                    if (divMatch) {
                        parentContainer.innerHTML = divMatch[0];
                    } else {
                        parentContainer.innerHTML = newTableHTML;
                    }
                }
            }
            
            showToast('Usulan berhasil diperbarui', 'success');
            
        } catch (err) {
            if (btn) {
                btn.disabled = false;
                btn.innerHTML = btnTextDefault;
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
            console.error('Error saving:', err);
            showToast('Gagal menyimpan: ' + err.message, 'error');
        }
    }

    function switchBABTab(tab) {
        STATE.baForm.activeTab = tab;
        const r = document.getElementById('baTabRingkas');
        const e = document.getElementById('baTabResmi');
        if (r) r.className = `px-4 py-2 rounded-md text-sm font-semibold transition-all ${tab === 'ringkas' ? 'bg-white text-honey-700 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`;
        if (e) e.className = `px-4 py-2 rounded-md text-sm font-semibold transition-all ${tab === 'resmi' ? 'bg-white text-honey-700 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`;
        updateBAPreview();
    }

    function switchBASubTab(sub) {
        STATE.baForm.resmiSubTab = sub;
        const map = { utama: 'baSubUtama', lampiran1: 'baSubLamp1', lampiran2: 'baSubLamp2' };
        Object.entries(map).forEach(([key, id]) => {
            const el = document.getElementById(id);
            if (el) el.className = `px-3 py-1.5 rounded-md text-[11px] font-semibold transition-all ${key === sub ? 'bg-white text-honey-700 shadow-sm' : 'text-gray-500 hover:text-gray-700'}`;
        });
        updateBAPreview();
    }

    /* ==========================================
    UPDATE PREVIEW
    ========================================== */
    function updateBAPreview() {
        const el = document.getElementById('baPrintArea');
        if (!el) return;
        const f = STATE.baForm;
        const tahun = STATE.tahunAktif;
        const usulanFinal = cachedUsulan.filter(x => x.tahun == tahun && (x.status === 'final' || x.status === 'ranked_dusun')).sort((a, b) => (parseInt(a.rankingDesa) || 999) - (parseInt(b.rankingDesa) || 999));
        const byDusun = {};
        usulanFinal.forEach(u => { if (!byDusun[u.dusun]) byDusun[u.dusun] = []; byDusun[u.dusun].push(u); });
        const totalBiaya = usulanFinal.reduce((s, u) => s + (parseInt(u.estimasiBiaya) || 0), 0);

        if (!usulanFinal.length) {
            el.innerHTML = `<div class="bg-white rounded-2xl border p-8 text-center text-gray-400 border-dashed border-2">
                <i class="fas fa-file-circle-xmark text-5xl mb-3 block opacity-30"></i>
                <p class="font-semibold text-gray-500">Belum Ada Usulan Final</p>
                <p class="text-xs mt-1">Isi form di atas setelah ada usulan dengan status "Diproses Dusun" atau "Final"</p>
            </div>`;
            return;
        }
        el.innerHTML = f.activeTab === 'ringkas' ? buildPreviewDraft(f, tahun, usulanFinal, byDusun, totalBiaya) : buildPreviewResmi(f, tahun, usulanFinal, byDusun, totalBiaya);
        /* Hitung halaman setelah render selesai */
        setTimeout(weCountPages, 150);
    }

    /* ==========================================
    HELPERS
    ========================================== */
    function formatMetodeKeputusan(key) {
        return { musyawarah_mufakat: 'Musyawarah Mufakat', aklamasi: 'Aklamasi', voting: 'Pemungutan Suara/Voting', mufakat_voting: 'Musyawarah Mufakat dan Pemungutan Suara/Voting' }[key] || 'Musyawarah Mufakat';
    }

    function formatTanggalLengkap(dateStr) {
        const d = new Date(dateStr + 'T00:00:00');
        const h = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        const b = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
        return { hari: h[d.getDay()], tgl: d.getDate(), bln: b[d.getMonth()], thn: d.getFullYear() };
    }

    /* ==========================================
    NARASUMBER ROWS — KOMPAK
    ========================================== */
    function buildNarasumberRows(f) {
        const filled = (f.narasumber || []).filter(n => n.nama.trim());
        if (filled.length > 0) {
            return filled.map((n, i) =>
                `<tr><td style="border:none; padding:0; vertical-align:top; line-height:1.5;">${i + 1}. ${escapeHtml(n.nama)}</td><td style="border:none; padding:0 4pt 0 3pt; vertical-align:top; white-space:nowrap; color:#555;">dari</td><td style="border:none; padding:0; vertical-align:top; line-height:1.5;">${escapeHtml(n.asal || '...................')}</td></tr>`
            ).join('');
        }
        return [1, 2, 3, 4].map(i =>
            `<tr><td style="border:none; padding:0; line-height:1.5;" colspan="3">${i}. ................... dari ...................</td></tr>`
        ).join('');
    }

        }

        const content = contentEl.innerHTML;

    </style>

/* ==========================================
    LAMPIRAN I — REKAPITULASI RINGKAS PER DUSUN
    ========================================== */
    function buildLampiranRingkasContent(f, tahun, usulanFinal, byDusun, totalBiaya, tglInfo) {
        const rkpT = f.rkpTahun || '........';
        const durkpT = f.durkpTahun || '........';
        
        /* Variabel Tambahan untuk Tanda Tangan */
        const kades = f.kadesNama || '....................................';
        const bpd = f.bpdNama || '....................................';
        const kadesNip = f.kadesNip || '';
        
        // FALLBACK AMAN: Jika tglInfo tidak dikirim, ambil dari f
        if (!tglInfo || !tglInfo.tgl) tglInfo = f.tglInfo || { tgl: '............', bln: '............', thn: '............' };

        let tabelRows = '';
        let no = 0;

        Object.entries(byDusun).forEach(([dusun, items]) => {
            const subTotal = items.reduce((s, i) => s + (parseInt(i.estimasiBiaya) || 0), 0);
            tabelRows += `
            <tr style="background:#e8f5e9;">
                <td colspan="5" style="border:1pt solid #000; padding:5pt 8pt; font-weight:bold; font-size:10pt;">
                    DUSUN ${escapeHtml(dusun.toUpperCase())} (${items.length} usulan)
                </td>
            </tr>`;
            items.forEach(item => {
                no++;
                tabelRows += `
                <tr>
                    <td style="border:1pt solid #999; padding:3pt 6pt; text-align:center; font-size:10pt;">${no}</td>
                    <td style="border:1pt solid #999; padding:3pt 6pt; font-size:10pt;">${escapeHtml(item.judul)}</td>
                    <td style="border:1pt solid #999; padding:3pt 6pt; text-align:center; font-size:10pt;">${Array.isArray(item.rt) ? item.rt.join(', ') : (item.rt || '-')}</td>
                    <td style="border:1pt solid #999; padding:3pt 6pt; text-align:center; font-size:10pt;">${item.rankingDesa || '-'}</td>
                    <td style="border:1pt solid #999; padding:3pt 6pt; text-align:right; font-size:10pt;">${formatRupiah(item.estimasiBiaya)}</td>
                </tr>`;
            });
            tabelRows += `
            <tr style="background:#f5f5f5; font-weight:bold;">
                <td colspan="4" style="border:1pt solid #999; padding:4pt 6pt; text-align:right; font-size:10pt;">Subtotal Dusun ${escapeHtml(dusun)}</td>
                <td style="border:1pt solid #999; padding:4pt 6pt; text-align:right; font-size:10pt;">${formatRupiah(subTotal)}</td>
            </tr>`;
        });

        tabelRows += `
        <tr style="background:#1b5e20; color:#fff; font-weight:bold;">
            <td colspan="4" style="border:1pt solid #1b5e20; padding:6pt 8pt; text-align:right; font-size:11pt;">TOTAL SELURUH USULAN PRIORITAS</td>
            <td style="border:1pt solid #1b5e20; padding:6pt 8pt; text-align:right; font-size:11pt;white-space:nowrap;">${formatRupiah(totalBiaya)}</td>
        </tr>`;

        return `
        <div style="text-align:center; margin-bottom:14pt;">
            <div style="font-size:13pt; font-weight:bold; text-transform:uppercase;">LAMPIRAN I</div>
            <div style="font-size:10pt; margin-top:3pt;">BERITA ACARA MUSYAWARAH DESA DESA JANGKANG</div>
            <div style="font-size:10pt; margin-top:2pt;">Nomor: ${escapeHtml(f.nomorSurat || '...')}</div>
            <div style="font-size:12pt; font-weight:bold; margin-top:8pt; text-transform:uppercase;">Rekapitulasi Usulan Prioritas Per Dusun</div>
            <div style="font-size:9pt; margin-top:3pt;">RKP Desa Tahun ${escapeHtml(rkpT)} &amp; Du-RKP Desa Tahun ${escapeHtml(durkpT)}</div>
        </div>
        <table style="width:100%; border-collapse:collapse; margin-bottom:14pt;">
            <thead>
                <tr style="background:#2e7d32; color:#fff;">
                    <td style="border:1pt solid #2e7d32; padding:5pt 6pt; width:8pt; text-align:center; font-weight:bold; font-size:10pt; white-space:nowrap;">No</td>
                    <td style="border:1pt solid #2e7d32; padding:5pt 6pt; font-weight:bold; font-size:10pt;">Usulan Kegiatan</td>
                    <td style="border:1pt solid #2e7d32; padding:5pt 6pt; width:28pt; text-align:center; font-weight:bold; font-size:10pt; white-space:nowrap;">RT</td>
                    <td style="border:1pt solid #2e7d32; padding:5pt 6pt; width:18pt; text-align:center; font-weight:bold; font-size:10pt; white-space:nowrap;">Rank</td>
                    <td style="border:1pt solid #2e7d32; padding:5pt 6pt; width:70pt; text-align:center; font-weight:bold; font-size:10pt; white-space:nowrap;">Estimasi Biaya</td>
                </tr>
            </thead>
            <tbody>${tabelRows}</tbody>
        </table>

        <!-- TANDA TANGAN: KADES & BPD SEJAJAR -->
        <div style="margin-top:20pt;">
            <table style="width:100%; border:none; border-collapse:collapse; font-size:11pt;">
                <tr style="vertical-align:top;">
                    <td style="border:none; width:50%; text-align:center; padding:0 10pt 0 0;">
                        <div style="height:15pt;"></div>
                        <div style="font-weight:bold;">Kepala Desa Jangkang</div>
                        <div style="height:65pt;"></div>
                        <div style="font-weight:bold;">${escapeHtml(kades)}</div>
                        ${kadesNip ? '<div style="font-size:9pt;">NIP. ' + escapeHtml(kadesNip) + '</div>' : ''}
                    </td>
                    <td style="border:none; width:50%; text-align:center; padding:0 0 0 10pt;">
                        <div>Jangkang, ${tglInfo.tgl} ${tglInfo.bln} ${tglInfo.thn}</div>
                        <div style="font-weight:bold;">Ketua BPD Desa Jangkang</div>
                        <div style="height:65pt;"></div>
                        <div style="font-weight:bold;">${escapeHtml(bpd)}</div>
                    </td>
                </tr>
            </table>
        </div>`;
    }

        const rkpT = f.rkpTahun || '........';

        // Mapping Nama Resmi 17 Tujuan SDGs Desa

            '1': 'Desa Tanpa Kemiskinan',
            '2': 'Desa Tanpa Kelaparan',
            '3': 'Desa Sehat dan Sejahtera',
            '4': 'Pendidikan Desa Berkualitas',

            '14': 'Desa Peduli Lingkungan Laut',
            '15': 'Desa Peduli Lingkungan Darat',
            '16': 'Desa Damai Berkeadilan',
            '17': 'Kemitraan untuk Pembangunan Desa'
        };

        // 1. Filter usulan yang memiliki SDG
        const usulanSDG = usulanFinal.filter(item => item.sdgId && String(item.sdgId).trim() !== '');
        let grandTotalSDG = 0;

        // 2. Kelompokkan berdasarkan ID SDG
        const groupedBySDG = {};
        usulanSDG.forEach(item => {
            const sdgs = String(item.sdgId).split(',').map(s => s.trim()).filter(Boolean);
            sdgs.forEach(sdg => {
                if (!groupedBySDG[sdg]) {
                    groupedBySDG[sdg] = { nama: sdgList[sdg] || `Tujuan ${sdg}`, items: [] };

                // Subtotal Per SDG
                tableSections += `
                <tr style="background:#f5f5f5; font-weight:bold;">
                    <td colspan="4" style="border:1pt solid #999; padding:4pt 6pt; text-align:right; font-size:9pt;">Subtotal SDGs ${sdgId}</td>
                    <td style="border:1pt solid #999; padding:4pt 6pt; text-align:right; font-size:9pt;">${formatRupiah(subTotal)}</td>
                </tr>`;

            // Grand Total Keseluruhan
            tableSections += `

                <td colspan="4" style="border:1pt solid #283593; padding:6pt 8pt; text-align:right; font-size:10pt;">TOTAL SELURUH USULAN TERHUBUNG SDGs</td>

        return `

            <div style="font-size:13pt; font-weight:bold; text-transform:uppercase;">LAMPIRAN III</div>
            <div style="font-size:10pt; margin-top:3pt;">BERITA ACARA MUSYAWARAH DESA DESA JANGKANG</div>

        </div>
        <table style="width:100%; border-collapse:collapse; margin-bottom:14pt;">

                    </td>

    /* ==========================================
    LAYOUT ENGINE — SLIDER, OVERLAY, HALAMAN
    ========================================== */

    /* Slider card untuk toolbar tata letak */
    function weSliderCard(label, key, value, min, max, unit, icon, step) {
        const dv = (key === 'lineHeight') ? Number(value).toFixed(2) : Math.round(value);
        return `
        <div style="display:flex; flex-direction:column; gap:1px;">
            <div style="display:flex; align-items:center; justify-content:space-between;">
                <span style="font-size:7.5px; color:#6b7280; font-weight:600;">
                    <i class="fas ${icon}" style="font-size:6px; margin-right:2px; opacity:.5;"></i>${label}
                </span>
                <span style="font-size:7.5px; color:#1f2937; font-weight:700;" id="weVal_${key}">${dv}${unit}</span>
            </div>
            <input type="range" min="${min}" max="${max}" step="${step}" value="${value}"
                   style="width:100%; height:3px; -webkit-appearance:none; appearance:none; background:#d1d5db; border-radius:2px; outline:none; cursor:pointer;"
                   oninput="weUpdateLayout('${key}', this.value, '${unit}')">
        </div>`;
    }

    /* Update layout saat slider digeser */
    function weUpdateLayout(key, value, unit) {
        if (!STATE.layoutConfig) STATE.layoutConfig = {};
        const numVal = Number(value);
        STATE.layoutConfig[key] = numVal;

        /* Update label nilai */
        const valEl = document.getElementById('weVal_' + key);
        if (valEl) valEl.textContent = (key === 'lineHeight' ? numVal.toFixed(2) : Math.round(numVal)) + unit;

        /* Update label mini preview */
        const miniMap = { marginTop:'weMiniTop', marginBottom:'weMiniBottom', marginLeft:'weMiniLeft', marginRight:'weMiniRight', lineHeight:'weMiniLine' };
        const miniEl = document.getElementById(miniMap[key]);
        if (miniEl) miniEl.textContent = key === 'lineHeight' ? numVal.toFixed(2) : Math.round(numVal);

        /* Apply ke kertas */
        const paper = document.getElementById('wePaper');
        if (paper) {
            const lc = STATE.layoutConfig;
            paper.style.paddingTop = (lc.marginTop || 25) + 'mm';
            paper.style.paddingBottom = (lc.marginBottom || 25) + 'mm';
            paper.style.paddingLeft = (lc.marginLeft || 25) + 'mm';
            paper.style.paddingRight = (lc.marginRight || 25) + 'mm';
            paper.style.lineHeight = lc.lineHeight || 1.5;
        }

        /* Rebuild overlay */
        weUpdateOverlay();
        weCountPages();
    }

    /* Bangun background overlay garis halaman */
    function weBuildOverlayBg(lc, showMargins) {
        const pageH = 297;
        const top = lc.marginTop || 25;
        const bot = lc.marginBottom || 25;
        const contentH = pageH - top - bot;
        let lines = '';
        for (let p = 1; p <= 30; p++) {
            const yPos = top + (contentH * p);
            lines += `linear-gradient(to bottom, transparent calc(${yPos}mm - 0.2mm), rgba(220,50,50,0.3) calc(${yPos}mm - 0.2mm), rgba(220,50,50,0.3) calc(${yPos}mm + 0.2mm), transparent calc(${yPos}mm + 0.2mm)) 0 0 / 100% 100% no-repeat, `;
        }
        return lines.slice(0, -2) || 'none';
    }

    /* Update overlay setelah margin berubah */
    function weUpdateOverlay() {
        const lc = STATE.layoutConfig || {};
        const overlay = document.getElementById('wePageOverlay');
        if (!overlay) return;

        const showMargins = overlay.getAttribute('data-margins') === '1';
        const pageH = 297;
        const top = lc.marginTop || 25;
        const bot = lc.marginBottom || 25;
        const left = lc.marginLeft || 25;
        const right = lc.marginRight || 25;
        const contentH = pageH - top - bot;

        /* Garis pemisah halaman merah */
        let lines = '';
        for (let p = 1; p <= 30; p++) {
            const yPos = top + (contentH * p);
            lines += `linear-gradient(to bottom, transparent calc(${yPos}mm - 0.2mm), rgba(220,50,50,0.3) calc(${yPos}mm - 0.2mm), rgba(220,50,50,0.3) calc(${yPos}mm + 0.2mm), transparent calc(${yPos}mm + 0.2mm)) 0 0 / 100% 100% no-repeat, `;
        }

        let css = 'position:absolute; inset:0; pointer-events:none; z-index:5; border-radius:1px;';
        if (showMargins) {
            css += `border:1px dashed rgba(37,99,235,0.25); `;
        }
        css += `background: ${lines.slice(0, -2)};`;
        overlay.style.cssText = css;

        /* Update mini margin preview */
        const miniMargin = document.getElementById('weMiniMargin');
        if (miniMargin) {
            const scaleX = 42, scaleY = 59;
            miniMargin.style.inset = `${(top / pageH) * scaleY}px ${(right / 210) * scaleX}px ${(bot / pageH) * scaleY}px ${(left / 210) * scaleX}px`;
        }
    }

    /* Toggle tampilan garis margin */
    function toggleMarginGuide() {
        const overlay = document.getElementById('wePageOverlay');
        if (!overlay) return;
        const cur = overlay.getAttribute('data-margins') === '1';
        overlay.setAttribute('data-margins', cur ? '0' : '1');
        weUpdateOverlay();
    }

    /* Toggle buka/tutup panel pengaturan */
    function toggleLayoutPanel() {
        const panel = document.getElementById('weLayoutPanel');
        const icon = document.getElementById('weToggleIcon');
        if (!panel) return;
        if (panel.style.maxHeight === '0px') {
            panel.style.maxHeight = '500px';
            panel.style.opacity = '1';
            if (icon) icon.style.transform = 'rotate(0deg)';
        } else {
            panel.style.maxHeight = '0px';
            panel.style.opacity = '0';
            if (icon) icon.style.transform = 'rotate(180deg)';
        }
    }

    /* Preset layout cepat */
    function wePreset(type) {
        const presets = {
            normal: { marginTop:25, marginBottom:25, marginLeft:25, marginRight:25, lineHeight:1.5 },
            narrow: { marginTop:15, marginBottom:15, marginLeft:15, marginRight:15, lineHeight:1.4 },
            wide:   { marginTop:30, marginBottom:30, marginLeft:30, marginRight:30, lineHeight:1.6 }
        };
        STATE.layoutConfig = { ...(presets[type] || presets.normal) };
        Object.entries(STATE.layoutConfig).forEach(([k, v]) => {
            weUpdateLayout(k, v, k === 'lineHeight' ? '' : 'mm');
        });
    }

    /* Reset ke default */
    function resetLayout() { wePreset('normal'); }

    /* Hitung jumlah halaman A4 */
    function weCountPages() {
        const paper = document.getElementById('wePaper');
        if (!paper) return;
        const lc = STATE.layoutConfig || {};
        const MM_TO_PX = 3.7795;
        const topPx = (lc.marginTop || 25) * MM_TO_PX;
        const botPx = (lc.marginBottom || 25) * MM_TO_PX;
        const pageContentPx = (297 * MM_TO_PX) - topPx - botPx;
        const totalPx = paper.scrollHeight;
        const pages = Math.max(1, Math.ceil(totalPx / pageContentPx));
        /* Update semua elemen dengan id wePageCount */
        document.querySelectorAll('[id="wePageCount"]').forEach(el => {
            el.textContent = pages + ' hal';
        });
    }

/* ==========================================
    SAVE TO WORD ENGINE (.doc)
    ========================================== */
    function saveToWord() {
        const paper = document.getElementById('wePaper');
        if (!paper) {
            showToast('Preview belum siap. Tunggu sebentar...', 'error');
            return;
        }

        const lc = STATE.layoutConfig || {};
        const f = STATE.baForm || {};
        let content = paper.innerHTML;

        /* ==========================================
           PREPROCESSOR: ADAPTASI KHUSUS MICROSOFT WORD
           Agar layout di Word 100% identik dengan Preview
           ========================================== */

    /**
     * Laporan Usulan Berdasarkan SDGs Desa
     */
    function rLaporanSDGS() {
        const tahun = STATE.tahunAktif;
        const usulanFinal = cachedUsulan.filter(x => 
            x.tahun == tahun && 
            (x.status === 'final' || x.status === 'ranked_dusun')
        );

        // SDGs Desa mapping (17 tujuan resmi)
        const sdgsList = [
            { no: 1,  nama: 'Desa Tanpa Kemiskinan',                  icon: 'fa-hand-holding-heart', color: '#E5243B' },
            { no: 2,  nama: 'Desa Tanpa Kelaparan',                   icon: 'fa-utensils',           color: '#DDA63A' },
            { no: 3,  nama: 'Desa Sehat dan Sejahtera',               icon: 'fa-heartbeat',          color: '#4C9F38' },
            { no: 4,  nama: 'Pendidikan Desa Berkualitas',            icon: 'fa-graduation-cap',     color: '#C5192D' },
            { no: 5,  nama: 'Keterlibatan Perempuan Desa',            icon: 'fa-venus',              color: '#FF3A21' },
            { no: 6,  nama: 'Desa dengan Air Minum dan Sanitasi Aman', icon: 'fa-tint',             color: '#26BDE2' },
            { no: 7,  nama: 'Desa Berenergi Bersih dan Terbarukan',   icon: 'fa-solar-panel',        color: '#FCC30B' },
            { no: 8,  nama: 'Pertumbuhan Ekonomi Desa Merata',        icon: 'fa-chart-line',         color: '#A21942' },
            { no: 9,  nama: 'Infrastruktur dan Inovasi Desa Sesuai Kebutuhan', icon: 'fa-road',     color: '#FD6925' },
            { no: 10, nama: 'Desa Tanpa Kesenjangan',                 icon: 'fa-balance-scale',      color: '#DD1367' },
            { no: 11, nama: 'Permukiman Desa Aman dan Nyaman',        icon: 'fa-home',               color: '#FD9D24' },
            { no: 12, nama: 'Konsumsi dan Produksi Desa Sadar Lingkungan', icon: 'fa-recycle',      color: '#BF8B2E' },
            { no: 13, nama: 'Desa Tanggap Perubahan Iklim',           icon: 'fa-cloud-sun',          color: '#3F7E44' },
            { no: 14, nama: 'Desa Peduli Lingkungan Laut',            icon: 'fa-fish',               color: '#0A97D9' },
            { no: 15, nama: 'Desa Peduli Lingkungan Darat',           icon: 'fa-tree',               color: '#56C02B' },
            { no: 16, nama: 'Desa Damai Berkeadilan',                 icon: 'fa-dove',               color: '#00689D' },
            { no: 17, nama: 'Kemitraan untuk Pembangunan Desa',       icon: 'fa-handshake',          color: '#19486A' }
        ];

        // Parsing field sdgId (mendukung: array, string koma, string tunggal, number)
        function parseSdgId(usulan) {
            const val = usulan.sdgId;
            if (val === null || val === undefined || val === '') return [];

            // Array: [6, 9, 11]
            if (Array.isArray(val)) {
                return val.map(s => parseInt(s)).filter(s => !isNaN(s) && s >= 1 && s <= 17);
            }

            // String koma: "6,9,11" atau "6, 9, 11"
            if (typeof val === 'string' && val.includes(',')) {
                return val.split(',').map(s => parseInt(s.trim())).filter(s => !isNaN(s) && s >= 1 && s <= 17);
            }

            // String tunggal: "6"
            if (typeof val === 'string') {
                const num = parseInt(val.trim());
                return (!isNaN(num) && num >= 1 && num <= 17) ? [num] : [];
            }

            // Number: 6
            if (typeof val === 'number') {
                return (val >= 1 && val <= 17) ? [val] : [];
            }

            return [];
        }

        // Hitung per SDGs
        const sdgsData = sdgsList.map(sdgs => {

        const tahun = STATE.tahunAktif;

            { no: 3,  nama: 'Desa Sehat dan Sejahtera',               icon: 'fa-heartbeat',          color: '#4C9F38' },

            { no: 11, nama: 'Permukiman Desa Aman dan Nyaman',        icon: 'fa-home',               color: '#FD9D24' },
            { no: 12, nama: 'Konsumsi dan Produksi Desa Sadar Lingkungan', icon: 'fa-recycle',      color: '#BF8B2E' },
            { no: 13, nama: 'Desa Tanggap Perubahan Iklim',           icon: 'fa-cloud-sun',          color: '#3F7E44' },
            { no: 14, nama: 'Desa Peduli Lingkungan Laut',            icon: 'fa-fish',               color: '#0A97D9' },
            { no: 15, nama: 'Desa Peduli Lingkungan Darat',           icon: 'fa-tree',               color: '#56C02B' },
            { no: 16, nama: 'Desa Damai Berkeadilan',                 icon: 'fa-dove',               color: '#00689D' },
            { no: 17, nama: 'Kemitraan untuk Pembangunan Desa',       icon: 'fa-handshake',          color: '#19486A' }
        ];

        // Parsing field sdgId
        function parseSdgId(usulan) {
            const val = usulan.sdgId;
            if (val === null || val === undefined || val === '') return [];
            if (Array.isArray(val)) {
                return val.map(s => parseInt(s)).filter(s => !isNaN(s) && s >= 1 && s <= 17);
            }
            if (typeof val === 'string' && val.includes(',')) {
                return val.split(',').map(s => parseInt(s.trim())).filter(s => !isNaN(s) && s >= 1 && s <= 17);
            }
            if (typeof val === 'string') {
                const num = parseInt(val.trim());
                return (!isNaN(num) && num >= 1 && num <= 17) ? [num] : [];
            }
            if (typeof val === 'number') {
                return (val >= 1 && val <= 17) ? [val] : [];
            }
            return [];
        }

        const sdgs = sdgsList.find(s => s.no === sdgsNo);
        if (!sdgs) return;

        const relatedUsulan = cachedUsulan.filter(u => {
            const ids = parseSdgId(u);
            return ids.includes(sdgsNo) && u.tahun == tahun && (u.status === 'final' || u.status === 'ranked_dusun');

        const totalBiaya = relatedUsulan.reduce((s, u) => s + (parseInt(u.estimasiBiaya) || 0), 0);

                        </div>

                </div>
                <div class="p-5">
                    <div class="flex gap-4 mb-4">
                        <div class="bg-gray-50 rounded-lg px-4 py-2 text-center">
                            <div class="text-lg font-bold text-gray-800">${relatedUsulan.length}</div>
                            <div class="text-[10px] text-gray-500">Usulan</div>
                        </div>
                        <div class="bg-gray-50 rounded-lg px-4 py-2 text-center">
                            <div class="text-lg font-bold text-gray-800">${formatRupiah(totalBiaya)}</div>
                            <div class="text-[10px] text-gray-500">Total Biaya</div>
                        </div>
                    </div>
                    <div class="overflow-x-auto border rounded-xl">
                        <table class="w-full text-xs">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-3 py-2 text-left font-semibold text-gray-600 w-10">No</th>
                                    <th class="px-3 py-2 text-left font-semibold text-gray-600">Judul Usulan</th>
                                    <th class="px-3 py-2 text-left font-semibold text-gray-600 w-20">Dusun</th>
                                    <th class="px-3 py-2 text-left font-semibold text-gray-600 w-24">Kategori</th>
                                    <th class="px-3 py-2 text-right font-semibold text-gray-600 w-28">Estimasi</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100">
                                ${relatedUsulan.map((u, i) => `
                                    <tr class="hover:bg-gray-50 cursor-pointer" onclick="closeModal(); setTimeout(()=>showDetail('${escapeJs(u.id)}'),200)">
                                        <td class="px-3 py-2 text-gray-500">${i + 1}</td>
                                        <td class="px-3 py-2 font-medium text-gray-800">${escapeHtml(u.judul)}</td>
                                        <td class="px-3 py-2 text-gray-500">${escapeHtml(u.dusun)}</td>

    const BA_STORAGE_KEY = 'baConfig_Jangkang_v1';

    function saveBAConfig() {
        if (typeof STATE === 'undefined' || !STATE.baForm) {
            showToast('Tidak ada data form untuk disimpan.', 'error');
            return;
        }
        
        // Ambil hanya data konfigurasi (tidak termasuk data usulan yang berat)
        const dataToSave = {
            tanggal: STATE.baForm.tanggal || '',
            jamMulai: STATE.baForm.jamMulai || '',
            jamSelesai: STATE.baForm.jamSelesai || '',
            zonaWaktu: STATE.baForm.zonaWaktu || 'WIB',
            tempat: STATE.baForm.tempat || '',
            nomorSurat: STATE.baForm.nomorSurat || '',
            metodeKeputusan: STATE.baForm.metodeKeputusan || 'musyawarah_mufakat',
            rkpTahun: STATE.baForm.rkpTahun || '',
            durkpTahun: STATE.baForm.durkpTahun || '',
            pemimpinMusyawarah: STATE.baForm.pemimpinMusyawarah || '',
            pemimpinAsal: STATE.baForm.pemimpinAsal || 'Ketua BPD',
            notulisNama: STATE.baForm.notulisNama || '',
            notulisAsal: STATE.baForm.notulisAsal || '',
            narasumber: STATE.baForm.narasumber || [{nama:'', asal:''}, {nama:'', asal:''}],
            kadesNama: STATE.baForm.kadesNama || '',
            kadesNip: STATE.baForm.kadesNip || '',
            bpdNama: STATE.baForm.bpdNama || '',
            wakilMasyarakat: STATE.baForm.wakilMasyarakat || ['', '', '', '', '']
        };

        try {
            localStorage.setItem(BA_STORAGE_KEY, JSON.stringify(dataToSave));
            showToast('Data konfigurasi berhasil disimpan!', 'success');
        } catch (e) {
            console.error(e);
            showToast('Gagal menyimpan data (Storage penuh).', 'error');
        }
    }

    function loadBAConfig() {
        try {
            const savedData = localStorage.getItem(BA_STORAGE_KEY);
            if (!savedData) {
                showToast('Belum ada data konfigurasi tersimpan.', 'info');
                return;
            }

            const parsedData = JSON.parse(savedData);
            
            // Update STATE.baForm
            if (typeof STATE !== 'undefined' && STATE.baForm) {
                Object.assign(STATE.baForm, parsedData);
                
                // Render ulang form agar input-value di HTML ikut berubah
                // GANTI "renderApp()" dengan nama fungsi render utama Anda jika berbeda
                if (typeof renderApp === 'function') {
                    renderApp();
                } else if (typeof renderBASection === 'function') {
                    renderBASection();
                } else {
                    // Fallback: refresh halaman jika fungsi render tidak ditemukan
                    window.location.reload();
                }
                
                showToast('Data konfigurasi berhasil dimuat!', 'success');
            }
        } catch (e) {
            console.error(e);
            showToast('Gagal membaca data tersimpan.', 'error');
        }
    }

    // Load deadline saat ganti tahun
    async function loadDeadlineForYear(tahun) {
        STATE.tahunAktif = tahun;
        const errEl = document.getElementById('dlErr');
        errEl && errEl.classList.add('hidden');

        const res = await API.post('getDeadlineLevels', { tahun: tahun });
        if (res.success) {
            const d = res.data || {};
            STATE.deadlineUser = d.deadlineUser || '';
            STATE.deadlineAdmDusun = d.deadlineAdmDusun || '';

            document.getElementById('dlDateUser').value = d.deadlineUser ? d.deadlineUser.slice(0, 16) : '';
            document.getElementById('dlDateAdmDusun').value = d.deadlineAdmDusun ? d.deadlineAdmDusun.slice(0, 16) : '';

            updateDeadlineStatusUI();
        }

        loadDeadlineSummary();
    }

    // Update tampilan status lock/unlock
    function updateDeadlineStatusUI() {
        const now = new Date();
        STATE.isLockedUser = STATE.deadlineUser && new Date(STATE.deadlineUser) <= now;
        STATE.isLockedAdmDusun = STATE.deadlineAdmDusun && new Date(STATE.deadlineAdmDusun) <= now;

        const elUser = document.getElementById('dlStatusUser');
        const elAdm = document.getElementById('dlStatusAdmDusun');

        if (elUser) {
            elUser.className = `${STATE.isLockedUser ? 'bg-red-50 border-red-200 text-red-700' : 'bg-forest-50 border-forest-200 text-forest-700'} border rounded-lg p-3 text-xs font-medium`;
            elUser.innerHTML = STATE.isLockedUser
                ? '<i class="fas fa-lock mr-1"></i>Status: DIKUNCI — Pengimputan User tahun ini telah ditutup.'
                : '<i class="fas fa-lock-open mr-1"></i>Status: TERBUKA — Pengimputan User tahun ini masih aktif.';
        }

        if (elAdm) {
            elAdm.className = `${STATE.isLockedAdmDusun ? 'bg-red-50 border-red-200 text-red-700' : 'bg-forest-50 border-forest-200 text-forest-700'} border rounded-lg p-3 text-xs font-medium`;
            elAdm.innerHTML = STATE.isLockedAdmDusun
                ? '<i class="fas fa-lock mr-1"></i>Status: DIKUNCI — Pengimputan Admin Dusun tahun ini telah ditutup.'
                : '<i class="fas fa-lock-open mr-1"></i>Status: TERBUKA — Pengimputan Admin Dusun tahun ini masih aktif.';
        }

    function showDlErr(msg) {
        const el = document.getElementById('dlErr');
        if (!el) return;
        el.textContent = msg;
        el.classList.remove('hidden');
    }
    function hideDlErr() {
        const el = document.getElementById('dlErr');
        if (!el) return;
        el.classList.add('hidden');
    }

    // ---- SIMPAN KEDUA DEADLINE ----
    async function saveDeadline() {
        hideDlErr();

        const tahun = document.getElementById('dlTahun').value;
        const dlUser = document.getElementById('dlDateUser').value;
        const dlAdmDusun = document.getElementById('dlDateAdmDusun').value;

        if (dlUser && dlAdmDusun && new Date(dlAdmDusun) < new Date(dlUser)) {
            showDlErr('Batas waktu Level 2 (Admin Dusun) tidak boleh lebih awal dari Level 1 (User).');
            return;
        }

        const btn = event.target.closest('button');
        const origHtml = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1.5"></i>Menyimpan...';

        const res = await API.post('setDeadlineLevel', {
            tahun: tahun,
            deadlineUser: dlUser || '',
            deadlineAdmDusun: dlAdmDusun || ''
        });

        btn.disabled = false;
        btn.innerHTML = origHtml;

        if (res.success) {
            STATE.deadlineUser = dlUser || '';
            STATE.deadlineAdmDusun = dlAdmDusun || '';
            updateDeadlineStatusUI();
            loadDeadlineSummary();
            showToast('Batas waktu berhasil disimpan.', 'success');
        } else {
            showDlErr(res.message || 'Gagal menyimpan batas waktu.');
        }
    }

    /* ==========================================
    RINGKASAN STATUS PER TAHUN (DUAL VIEW)
    ========================================== */

    // Helper: hitung sisa waktu
    function getDeadlineRemaining(dl) {
        if (!dl) return null;
        const now = new Date();
        const diff = new Date(dl) - now;
        if (diff <= 0) return { text: 'Berakhir', pct: 100, urgent: true, ended: true };
        const days = Math.floor(diff / 86400000);
        const hrs = Math.floor((diff % 86400000) / 3600000);
        if (days > 7) return { text: days + ' hari lagi', pct: Math.min(95, Math.max(10, 100 - (days / 30 * 100))), urgent: false, ended: false };
        if (days > 0) return { text: days + ' hari ' + hrs + ' jam lagi', pct: Math.min(95, Math.max(30, 100 - (days * 10))), urgent: true, ended: false };
        return { text: hrs + ' jam lagi', pct: 95, urgent: true, ended: false };
    }

    // Helper: format tanggal
    function formatTanggal(dt) {
        if (!dt) return '-';
        const d = new Date(dt);
        return d.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) + ' ' + d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    }

    // ---- Render utama ----
    async function loadDeadlineSummary() {
        const mobEl = document.getElementById('deadlineSummaryMobile');
        const deskEl = document.getElementById('deadlineSummaryDesktop');
        if (!mobEl && !deskEl) return;

        // Loading state
        const loadingHTML = '<div class="text-center py-8 text-gray-400 text-xs"><span class="spinner"></span> Memuat...</div>';
        if (mobEl) mobEl.innerHTML = loadingHTML;
        if (deskEl) deskEl.innerHTML = loadingHTML;

        const res = await API.post('getDeadlineSummary', {});

        if (!res.success || !res.data || !res.data.length) {
            const emptyHTML = `
                <div class="text-center py-10">
                    <div class="w-14 h-14 mx-auto mb-3 rounded-full bg-gray-50 flex items-center justify-center">
                        <i class="fas fa-calendar-xmark text-gray-300 text-xl"></i>
                    </div>
                    <p class="text-xs text-gray-400 font-medium">Belum ada data batas waktu</p>
                </div>`;
            if (mobEl) mobEl.innerHTML = emptyHTML;
            if (deskEl) deskEl.innerHTML = emptyHTML;
            return;
        }

        // ---------- Bangun data per-tahun ----------
        const items = res.data.map(d => {
            const lockU = d.deadlineUser && new Date(d.deadlineUser) <= new Date();
            const lockA = d.deadlineAdmDusun && new Date(d.deadlineAdmDusun) <= new Date();
            const bothLocked = lockU && lockA;
            const active = String(d.tahun) === String(STATE.tahunAktif);
            const remU = getDeadlineRemaining(d.deadlineUser);
            const remA = getDeadlineRemaining(d.deadlineAdmDusun);
            const hasAny = d.deadlineUser || d.deadlineAdmDusun;

            let statusKey, statusLabel, statusCls;
            if (bothLocked) { statusKey = 'locked'; statusLabel = 'Dikunci'; statusCls = 'bg-red-100 text-red-700'; }
            else if (lockU || lockA) { statusKey = 'partial'; statusLabel = 'Sebagian'; statusCls = 'bg-amber-100 text-amber-700'; }
            else if (hasAny) { statusKey = 'active'; statusLabel = 'Aktif'; statusCls = 'bg-forest-100 text-forest-700'; }
            else { statusKey = 'empty'; statusLabel = 'Kosong'; statusCls = 'bg-gray-100 text-gray-500'; }

            return { ...d, lockU, lockA, bothLocked, active, remU, remA, hasAny, statusKey, statusLabel, statusCls };
        });

        // ================= DESKTOP: TABLE =================
        const batasCell = (dl, rem) => {
            if (!dl) {
                return `<td class="px-3 py-3">
                    <div class="flex items-center gap-2">
                        <span class="text-[11px] text-gray-400 italic">Tanpa batas</span>
                    </div>
                </td>`;
            }
            const locked = rem.ended;
            const barClr = locked ? 'bg-red-500' : rem.urgent ? 'bg-amber-500' : 'bg-forest-500';
            const sisaClr = locked ? 'text-red-600' : rem.urgent ? 'text-amber-600' : 'text-forest-600';
            const badgeBg = locked ? 'bg-red-100 text-red-700' : 'bg-forest-100 text-forest-700';
            const badgeIcon = locked ? 'fa-lock' : 'fa-lock-open';
            const badgeText = locked ? 'Dikunci' : 'Terbuka';

            return `<td class="px-3 py-3">
                <div class="space-y-1.5">
                    <div class="text-[11px] font-semibold text-gray-700">${formatTanggal(dl)}</div>
                    <div class="flex items-center gap-2">
                        <div class="flex-1 h-1.5 bg-gray-100 rounded-full overflow-hidden">
                            <div class="h-full ${barClr} rounded-full transition-all" style="width:${rem.pct}%"></div>
                        </div>
                        <span class="text-[10px] font-bold ${sisaClr} whitespace-nowrap">${rem.text}</span>
                    </div>
                    <span class="inline-flex items-center gap-1 px-1.5 py-0.5 ${badgeBg} rounded text-[9px] font-bold">
                        <i class="fas ${badgeIcon} text-[7px]"></i>${badgeText}
                    </span>
                </div>
            </td>`;
        };

        const deskRows = items.map(d => {
            const rowBg = d.active ? 'bg-honey-50/50' : 'bg-white';
            const rowBorder = d.active ? 'border-honey-200' : 'border-gray-100';
            const yearBadge = d.bothLocked ? 'bg-red-100 text-red-600' : d.active ? 'bg-honey-100 text-honey-600' : 'bg-gray-100 text-gray-500';
            const statusIcon = d.statusKey === 'locked' ? 'fa-lock' : d.statusKey === 'partial' ? 'fa-exclamation-circle' : d.statusKey === 'active' ? 'fa-check' : 'fa-minus';

            return `<tr class="${rowBg} border-b ${rowBorder} hover:shadow-[inset_0_0_0_1px_rgba(0,0,0,0.04)] transition-all">
                <td class="px-3 py-3">
                    <div class="flex items-center gap-2">
                        <div class="w-9 h-9 rounded-lg ${yearBadge} flex items-center justify-center font-display font-800 text-xs flex-shrink-0">${d.tahun.slice(2)}</div>
                        <div>
                            <div class="text-xs font-display font-700 text-gray-800 leading-tight">Tahun ${d.tahun}</div>
                            ${d.active
                                ? '<span class="text-[8px] font-bold text-honey-700 bg-honey-200/70 px-1.5 py-px rounded-sm leading-none">AKTIF</span>'
                                : '<span class="text-[8px] text-gray-400 leading-none">Arsip</span>'}
                        </div>
                    </div>
                </td>
                ${batasCell(d.deadlineUser, d.remU)}
                ${batasCell(d.deadlineAdmDusun, d.remA)}
                <td class="px-3 py-3 text-center">
                    <span class="inline-flex items-center gap-1 px-2.5 py-1 ${d.statusCls} rounded-lg text-[10px] font-bold whitespace-nowrap">
                        <i class="fas ${statusIcon} text-[8px]"></i>${d.statusLabel}
                    </span>
                </td>
            </tr>`;
        }).join('');

        if (deskEl) {
            deskEl.innerHTML = `
            <div class="overflow-x-auto rounded-xl border border-gray-200 bg-white shadow-sm">
                <table class="w-full min-w-[620px]">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-200">
                            <th class="px-3 py-2.5 text-left text-[10px] font-bold text-gray-500 uppercase tracking-wider w-[120px]">Tahun</th>
                            <th class="px-3 py-2.5 text-left text-[10px] font-bold text-gray-500 uppercase tracking-wider">
                                <div class="flex items-center gap-1.5">
                                    <span class="w-5 h-5 rounded bg-blue-100 text-blue-600 flex items-center justify-center text-[8px] font-bold">1</span>
                                    Batas Level 1 – User
                                </div>
                            </th>
                            <th class="px-3 py-2.5 text-left text-[10px] font-bold text-gray-500 uppercase tracking-wider">
                                <div class="flex items-center gap-1.5">
                                    <span class="w-5 h-5 rounded bg-violet-100 text-violet-600 flex items-center justify-center text-[8px] font-bold">2</span>

                                </div>
                            </th>
                            <th class="px-3 py-2.5 text-center text-[10px] font-bold text-gray-500 uppercase tracking-wider w-[100px]">Status</th>
                        </tr>
                    </thead>
                    <tbody>${deskRows}</tbody>
                </table>
            </div>`;
        }

        // ================= MOBILE: CARDS =================
        const levelCard = (label, numBg, numClr, dl, rem) => {
            if (!dl) {
                return `<div class="flex items-center gap-2.5 py-2">
                    <span class="w-5 h-5 rounded ${numBg} ${numClr} flex items-center justify-center text-[8px] font-bold flex-shrink-0">${''}</span>

                    <span class="text-[11px] text-gray-400 italic ml-auto">Tanpa batas</span>
                </div>`;
            }

            const locked = rem.ended;
            const barClr = locked ? 'bg-red-500' : rem.urgent ? 'bg-amber-500' : 'bg-forest-500';
            const sisaClr = locked ? 'text-red-600' : rem.urgent ? 'text-amber-600' : 'text-forest-600';
            const badgeBg = locked ? 'bg-red-100 text-red-700' : 'bg-forest-100 text-forest-700';

    async function handleUbahPassword(e) {
        // 1. CEGAH REFRESH HALAMAN
        e.preventDefault();

        // Gunakan .trim() untuk menghapus spasi
        const oldPw = document.getElementById('pwOld').value.trim();
        const newPw = document.getElementById('pwNew').value.trim();
        const confPw = document.getElementById('pwNewC').value.trim();
        
        const errBox = document.getElementById('errPw');
        const btn = e.target.querySelector('button[type="submit"]');

        // 2. Validasi Input
        if (!newPw) {
            showErrorPw(errBox, 'Password baru tidak boleh kosong.');
            return;
        }

        if (!CONFIG.PASS_REGEX.test(newPw)) {
            showErrorPw(errBox, 'Password baru tidak memenuhi syarat keamanan.');
            return;
        }

        if (newPw !== confPw) {
            showErrorPw(errBox, 'Konfirmasi password baru tidak cocok.');
            return;
        }

        if (oldPw === newPw) {
            showErrorPw(errBox, 'Password baru tidak boleh sama dengan password lama.');
            return;
        }

        // 3. Enkripsi Password
        const oldHash = await sha256(oldPw);
        const newHash = await sha256(newPw);

        // 4. Tampilkan Loading
        const originalBtnText = btn.innerText;
        btn.disabled = true;
        btn.innerText = "Menyimpan...";
        errBox.classList.add('hidden');

        // 5. Kirim ke Server (API)
        const res = await API.post('changePassword', {
            username: STATE.currentUser.username,
            oldHash: oldHash,
            newHash: newHash
        });

        // 6. Handle Response
        if (res.success) {
            showToast('Password berhasil diubah!', 'success');
            
            // --- PERBAIKAN DI SINI ---
            
            // Ubah tulisan tombol menjadi "Berhasil!"`
            btn.innerText = "Berhasil!";
            
            // Kosongkan input secara MANUAL (agar tombol tidak ikut kembali ke "Simpan Password")
            document.getElementById('pwOld').value = '';
            document.getElementById('pwNew').value = '';
            document.getElementById('pwNewC').value = '';
            
            // Tutup modal setelah delay 1 detik agar user sempat melihat tulisan "Berhasil!"`}
            setTimeout(() => {
                closeModal();
            }, 1000);
            
            // -----------------------
        } else {
            errBox.textContent = res.message || 'Gagal mengubah password. Cek password lama Anda.';
            errBox.classList.remove('hidden');
            
            // Kembalikan tombol ke kondisi semula
            btn.disabled = false;
            btn.innerText = originalBtnText;
        }
    }

    /* ==========================================

    function filterUserTable(q) {
        q = q.toLowerCase();

        // Desktop
        const rows = document.querySelectorAll('#tableUserWrap tr[id^="row-user-"]');
        let deskNum = 1;
        rows.forEach(row => {
            const text = row.textContent.toLowerCase();
            if (text.includes(q)) {
                row.style.display = '';
                const numCell = row.querySelector('.row-user-num');
                if (numCell) numCell.textContent = deskNum++;
            } else {
                row.style.display = 'none';
            }
        });

        // Mobile
        const cards = document.querySelectorAll('#userCardsMobile .card-user-item');
        let cardNum = 1;
        cards.forEach(card => {
            const text = card.textContent.toLowerCase();
            if (text.includes(q)) {
                card.style.display = '';
                const numSpan = card.querySelector('.card-user-num');
                if (numSpan) numSpan.textContent = cardNum++;
            } else {
                card.style.display = 'none';
            }
        });
    }

            rtLabel.classList.add('text-gray-400');
        }
        
        // ✅ PERUBAHAN: Auto-fill Dusun (Bisa lebih dari 1, pisah koma)

            const selectedDusuns = selectedRts.map(rt => CONFIG.RT_MAP[rt]).filter(Boolean);
            const uniqueDusuns = [...new Set(selectedDusuns)]; // Hilangkan duplikat

        }

            errEl.classList.remove('hidden'); 
            return; 
        }
        
        const isMusdesDesa = document.getElementById('fIsMusdesDesa')?.value === 'true';
        const editId = document.getElementById('fId').value;
        const isEdit = !!editId;
        const rawBiaya = document.getElementById('fBiaya').value;
        const biayaNum = unformatRupiah(rawBiaya);
        
        const data = {
            id: editId || null, 
            username: u.username, 
            tahun: STATE.tahunAktif,
            judul: form.querySelector('#fJudul').value.trim(),
            kategori: form.querySelector('#fKategori').value,
            deskripsi: form.querySelector('#fDeskripsi').value.trim(),
            rt: rts, 
            dusun: form.querySelector('#fDusun').value, 
            desa: CONFIG.DESA,
            volume: parseInt(form.querySelector('#fVolume').value),
            satuan: form.querySelector('#fSatuan').value,
            estimasiBiaya: biayaNum,
            sdgId: form.querySelector('#fSdgId').value.split(',').filter(Boolean),
            linkProposal: form.querySelector('#fLink').value.trim()
        };
        
        // ✅ 2. ATUR LOGIKA STATUS & DATA AWAL
        if (isMusdesDesa && !isEdit) {
            // Musdes Desa - biarkan backend atur status
        } else if (isEdit) {
            const ex = cachedUsulan.find(x => x.id === editId);
            data.status = ex ? ex.status : 'draft';
            
            // ✅ TAMBAHAN: Kirim info siapa yang edit (untuk cek backend)
            data.editedBy = u.username;
            data.editedByRole = u.role;
        } else {
            // ✅ PERBAIKAN: Tambahkan admdesa
            if (u.role === 'admdusun') {
                data.status = 'diajukan';
            } else if (u.role === 'admdesa') {
                data.status = 'draft'; // atau 'diajukan' jika langsung
            } else {
                data.status = 'draft';
            }
            
            data.rankingDusun = ''; 
            data.rankingDesa = ''; 
            data.rencanaAksi = ''; 
            data.rujukanUsulan = ''; 
            data.catatanKembali = '';
        }
        
        // ✅ 3. DYNAMIS ENDPOINT API
        const apiAction = (isMusdesDesa && !isEdit) ? 'saveUsulanMusdes' : 'saveUsulan';
        
        setTableLoading(true);
        try {
            const res = await API.post(apiAction, data);
            
            if (res.success) {
                const newData = { ...data, ...(res.data || {}) };
                if (isEdit) {
                    const idx = cachedUsulan.findIndex(x => x.id === editId);
                    if (idx > -1) cachedUsulan[idx] = newData;
                } else {
                    cachedUsulan.unshift(newData);
                }
                closeModal();
                await fetchUsulan(true);
                const c = document.getElementById('tabContent');
                if (c) {
                    c.innerHTML = renderTab();
                    if (STATE.dashboardTab === 'beranda') initCharts();
                }
                
                // ✅ SESUAIKAN PESAN TOAST
                if (isMusdesDesa && !isEdit) {
                    showToast('Usulan hasil Musdes berhasil disimpan langsung sebagai Ranked Dusun.', 'success');
                } else if (isEdit) {
                    showToast('Usulan berhasil diperbarui', 'success');
                } else if (u.role === 'admdusun') {
                    showToast('Usulan berhasil disimpan & otomatis diajukan ke Desa.', 'success');
                } else if (u.role === 'admdesa') {
                    showToast('Usulan berhasil disimpan oleh Admin Desa.', 'success');
                } else {
                    showToast('Usulan berhasil disimpan sebagai draft', 'success');
                }
            } else {
                errEl.textContent = res.message || 'Gagal menyimpan'; 
                errEl.classList.remove('hidden'); 
            }
        } catch(e) {
            errEl.textContent = 'Gagal menyimpan. Periksa koneksi internet.'; 
            errEl.classList.remove('hidden'); 
        } finally {
            setTableLoading(false);
        }
    }

    async function switchTab(tab) {
        const tabs = getTabs(STATE.currentUser?.role);
        let currentTab = tabs.find(t => t.key === tab);
        let parentTab = null;

        // ✅ 1. Jika klik parent submenu, arahkan ke sub-tab pertama
        if (currentTab?.isSubmenuParent) {
            const firstSub = tabs.find(t => t.parentTab === tab);
            if (firstSub) {
                tab = firstSub.key;
                currentTab = firstSub;
                parentTab = tabs.find(t => t.key === currentTab.parentTab);
            }
        } else if (currentTab?.parentTab) {
            // ✅ 2. Jika klik sub-tab, simpan parent-nya untuk keperluan UI
            parentTab = tabs.find(t => t.key === currentTab.parentTab);
        }

        STATE.dashboardTab = tab;
        
        const sb = document.getElementById('sidebar');
        const ov = document.getElementById('sidebarOverlay');
        
        // Tutup sidebar otomatis di mobile saat ganti tab
        if (sb && !sb.classList.contains('-translate-x-full') && window.innerWidth < 1024) { 
            toggleSidebar(); 
        }

        // ✅ 3. Buka parent submenu di sidebar jika sedang di sub-tab
        if (parentTab) {
            openSubmenu(parentTab.key);
        }

        // ✅ 4. Update warna sidebar (Mendukung Parent & Child)
        document.querySelectorAll('.sidebar-link').forEach(el => {
            const isActive = el.dataset.tab === tab || el.dataset.tab === parentTab?.key;
            el.classList.toggle('active', isActive);
        });

        // ✅ 5. Update Header dengan Breadcrumb (Parent > Child)
        const headerEl = document.getElementById('headerTitle');
        if (headerEl && currentTab) {
            if (parentTab) {
                headerEl.innerHTML = `
                    <span class="text-gray-400 text-[11px] font-medium hidden sm:inline">${parentTab.label}</span>
                    <i class="fas fa-chevron-right text-[8px] text-gray-300 hidden sm:inline"></i>
                    <span class="truncate">${currentTab.label}</span>`;
            } else {
                headerEl.innerHTML = `<span class="truncate">${currentTab.label}</span>`;
            }
        }

        // ✅ 6. Update warna Bottom Nav (Mendukung highlight Parent saat Child aktif)
        document.querySelectorAll('.bnav-btn').forEach(btn => {
            const btnKey = btn.dataset.tab;
            const isActive = btnKey === tab || btnKey === parentTab?.key;
            
            btn.classList.remove('text-honey-600', 'bg-honey-50', 'text-gray-400', 'active:text-gray-600', 'active:bg-gray-50');
            if (isActive) {
                btn.classList.add('text-honey-600', 'bg-honey-50');
            } else {
                btn.classList.add('text-gray-400', 'active:text-gray-600', 'active:bg-gray-50');
            }

            // Toggle chevron untuk parent submenu
            const chevron = btn.querySelector('.fa-chevron-up');
            if (chevron) {
                chevron.classList.toggle('opacity-100', isActive);
                chevron.classList.toggle('opacity-0', !isActive);
            }
        });

        // Tutup bottom popup submenu
        closeBottomSubmenu();

        // --- KODE FETCH & RENDER ANDA (TIDAK DIUBAH SAMA SEKALI) ---
        const c = document.getElementById('tabContent');
        const needsDataFetch = cachedUsulan.length === 0 || cachedUsulan[0].tahun != STATE.tahunAktif;
        let fetchPromises = [];
        if (needsDataFetch) { fetchPromises.push(fetchUsulan(true)); fetchPromises.push(fetchDeadline()); }
        if (tab === 'users') fetchPromises.push(fetchUsersData());
        if (tab === 'pengaturan') fetchPromises.push(fetchDeadlinesData());
        
        if (fetchPromises.length > 0 || needsDataFetch) {
            if (c) c.innerHTML = '<div class="text-center py-16 text-gray-400"><span class="spinner"></span> Memuat data...</div>';
            try { 
                await Promise.all(fetchPromises); 
                if (c) c.innerHTML = renderTab(); 
                if (tab === 'users') renderUserTable(); 
                if (tab === 'pengaturan') renderDeadlineSummary(); 
                if (tab === 'beranda') initCharts(); 
            } catch (e) { 
                console.error(e); 
                if (c) c.innerHTML = '<div class="text-center py-16 text-red-400"><i class="fas fa-exclamation-circle text-3xl mb-2 block"></i>Gagal memuat data.</div>'; 
            }
        } else {
            if (c) c.innerHTML = renderTab();
            if (tab === 'beranda') initCharts();
            if (tab === 'users') renderUserTable();
            if (tab === 'pengaturan') renderDeadlineSummary();
        }
        attachMainEvents();
    }

    function showLogoutConfirm() {
        return new Promise((resolve) => {
            // ✅ Gunakan class CSS yang SUDAH ADA (confirm-overlay) 
            // agar style dan animasi konsisten dengan modal hapus
            const overlay = document.createElement('div');
            overlay.className = 'confirm-overlay';
            overlay.id = 'logoutModal';
            overlay.innerHTML = `
                <div class="confirm-card">
                    <div class="confirm-icon" style="background: #fef2f2; color: #ef4444;">
                        <i class="fas fa-sign-out-alt" style="font-size: 1.5rem;"></i>
                    </div>
                    <div class="confirm-title">Keluar Akun?</div>
                    <div class="confirm-message">Anda harus login kembali untuk mengakses sistem.<br>Apakah Anda yakin ingin keluar?</div>
                    <div class="confirm-actions">
                        <button class="confirm-btn confirm-btn-cancel" id="btnCancelLogout">Batal</button>
                        <button class="confirm-btn confirm-btn-delete" id="btnConfirmLogout">Ya, Keluar</button>
                    </div>
                </div>
            `;

            document.body.appendChild(overlay);

            // Trigger animasi masuk
            requestAnimationFrame(() => {
                overlay.classList.add('active');
            });

            // Fungsi tutup dengan animasi keluar
            const closeModal = (result) => {
                overlay.classList.remove('active');
                setTimeout(() => {
                    overlay.remove();
                    resolve(result);
                }, 200); // Sesuai durasi CSS transition
            };

            // Event Listener
            overlay.querySelector('#btnCancelLogout').addEventListener('click', () => closeModal(false));
            overlay.querySelector('#btnConfirmLogout').addEventListener('click', () => closeModal(true));
            
            // Tutup jika klik area luar (overlay hitam)
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) closeModal(false);
            });
        });
    }

    // ✅ TAMBAHKAN INI di bawah deklarasi variabel timer
    window.INACTIVITY_LIMIT = 10 * 60 * 1000;
    window.WARNING_BEFORE = 60 * 1000;
    window.inactivityTimer = null;
    window.warningTimer = null;
    window.countdownInterval = null;

    function initInactivitySystem() {
        window.loginTime = new Date(); // ✅ RESET WAKTU LOGIN SETIAP KALI INIT
        
        const events = ['mousedown', 'mousemove', 'keydown', 'scroll', 'touchstart', 'click'];
        events.forEach(evt => {
            document.removeEventListener(evt, handleUserActivity);
            document.addEventListener(evt, handleUserActivity, { passive: true });
        });
        resetInactivityTimer();
        console.log('[System] Inactivity timer dimulai (10 menit)');
    }

    function handleUserActivity() {
        if (window.isWarningShown) {
            closeInactivityWarning();
        }
        resetInactivityTimer();
    }

    function resetInactivityTimer() {
        clearTimeout(window.inactivityTimer);
        clearTimeout(window.warningTimer);
        clearInterval(window.countdownInterval);

        // Timer untuk menampilkan WARNING (9 menit)
        window.warningTimer = setTimeout(() => {
            showInactivityWarning();
        }, window.INACTIVITY_LIMIT - window.WARNING_BEFORE);

        // Timer untuk eksekusi LOGOUT OTOMATIS (10 menit)
        window.inactivityTimer = setTimeout(() => {
            forceLogout();
        }, window.INACTIVITY_LIMIT);
    }

    function showInactivityWarning() {
        if (window.isWarningShown) return;
        window.isWarningShown = true;

        let timeLeft = Math.ceil(window.WARNING_BEFORE / 1000);

        const overlay = document.createElement('div');
        overlay.id = 'inactivityWarningModal';
        overlay.className = 'confirm-overlay';
        overlay.innerHTML = `
            <div class="confirm-card" style="border: 2px solid #f59e0b;">
                <div class="confirm-icon" style="background: #fffbeb; color: #f59e0b;">
                    <i class="fas fa-hourglass-half" style="font-size: 1.5rem; animation: spin 2s linear infinite;"></i>
                </div>
                <div class="confirm-title" style="color: #92400e;">Sesi Anda Akan Berakhir</div>
                <div class="confirm-message">
                    Tidak terdeteksi aktivitas. Anda akan otomatis keluar dalam<br>
                    <span id="inactivityCountdown" style="font-size: 1.25rem; font-weight: 800; color: #dc2626; display: inline-block; min-width: 30px;">${timeLeft}</span> detik.

    // ==========================================
    // HELPER: FORMAT DURASI (DETIK → "1j 23m 45d")
    // ==========================================
    function formatDuration(totalSeconds) {
        if (!totalSeconds || totalSeconds < 0) return '0d';
        
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const seconds = totalSeconds % 60;
        
        let parts = [];
        if (hours > 0) parts.push(hours + 'j');
        if (minutes > 0) parts.push(minutes + 'm');
        if (seconds > 0 || parts.length === 0) parts.push(seconds + 'd');
        
        return parts.join(' ');
    }

                    </div>
                </div>
            `;

            document.body.appendChild(overlay);
            requestAnimationFrame(() => overlay.classList.add('active'));

    }

        // ═══════════════════════════════════════════

        return `
        <style>

        <div class="space-y-4">
            ${statsHTML}
            
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
